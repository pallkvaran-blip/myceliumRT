# Build the itch.io zip and attach it to a GitHub release.
#
# RUN IT FROM THE ACTIONS TAB: "Build itch zip" -> Run workflow. Nothing here is scheduled and
# nothing runs on push — a release is a deliberate act, and this file exists because the assistant
# session that wrote it cannot create releases itself (its GitHub tools are read-only and the
# direct API is blocked), so the button is yours.
#
# The release is a DRAFT by default: it exists, the zip is attached and downloadable, and nothing
# is visible on the repo page until you press Publish. Set `draft` to false if you want it public
# straight away.
#
# What it produces is exactly what `node scripts/make-itch-zip.mjs` produces locally —
# index.html + assets/ at the zip root, with CONFIG.dev.enabled patched to false. The script
# fails the build rather than shipping the dev buttons if it cannot find the flag.
name: Build web zip

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. build-2026-08-07)'
        required: true
        type: string
      draft:
        description: 'Keep the release as a draft (nothing public until you press Publish)'
        required: false
        default: true
        type: boolean
      platform:
        description: 'Which store this build is for. CrazyGames gets the SDK injected; itch must not have it.'
        required: false
        default: itch
        type: choice
        options: [itch, crazygames]

permissions:
  contents: write        # needed to create the release and upload the asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v5/v6 RUN ON NODE 24. v4 targets Node 20, which GitHub deprecated on 2025-09-19 and now
      # force-runs on 24 anyway — a warning rather than a failure, but the warning is noise on
      # every run and Node 20 leaves the runners entirely on 2026-09-16. They need a runner at
      # 2.327.1+, which GitHub-hosted runners are.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # THE BUILD RE-ENCODES THE ART, and that needs Pillow — which the runner does not have and
      # this container did, so it passed locally and failed only in CI. imageio-ffmpeg is the same
      # story for the music: the build carries on without it, at full bitrate, so it is installed
      # here rather than left to chance.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install the re-encoder's dependencies
        run: python3 -m pip install --upgrade Pillow imageio-ffmpeg

      - name: Build the zip
        run: node scripts/make-web-zip.mjs --platform ${{ inputs.platform }} --keep-stage

      # Belt to the script's own brace. The one thing that must never ship is the dev build, so it
      # is checked again here against the bytes in the archive rather than against the tree.
      - name: Confirm the dev buttons are off in the archive
        run: |
          set -euo pipefail
          unzip -p dist/mycelium-${{ inputs.platform }}.zip index.html > /tmp/built.html
          if grep -q 'itch zip, and confirm with scratchpad/verify-nodev.mjs' /tmp/built.html \
             && grep -A1 'itch zip, and confirm with scratchpad/verify-nodev.mjs' /tmp/built.html | grep -q 'enabled: false,'; then
            echo "dev.enabled is false in the archive"
          else
            echo "REFUSING: could not confirm dev.enabled is false in the built index.html" >&2
            exit 1
          fi
          unzip -Z1 dist/mycelium-${{ inputs.platform }}.zip | head -1 | grep -qx 'index.html' \
            || { echo "REFUSING: index.html is not at the zip root" >&2; exit 1; }
          ls -la dist/mycelium-${{ inputs.platform }}.zip

      # ALSO A WORKFLOW ARTIFACT — but of the STAGE DIRECTORY, not of the zip, and that distinction
      # is the whole point. GitHub zips an artifact's contents on download, so uploading the .zip
      # gives you `mycelium-itch-zip.zip` containing `mycelium-itch.zip`: a DOUBLE ZIP, which itch
      # rejects with "Failed to find index.html" because the html is one level down. Reported.
      # Uploading the stage instead means the artifact GitHub builds has index.html at ITS root, so
      # the download is itself a valid itch zip and both routes out of this workflow work.
      - uses: actions/upload-artifact@v6
        with:
          name: mycelium-${{ inputs.platform }}
          path: dist/stage-${{ inputs.platform }}
          retention-days: 30

      - name: Attach it to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ inputs.tag }}" dist/mycelium-${{ inputs.platform }}.zip \
            --title "Mycelium — ${{ inputs.tag }}" \
            --notes "itch.io HTML5 build. **Upload the \`mycelium-${{ inputs.platform }}.zip\` attached here** — as an HTML5 project, fullscreen button ON, mobile-friendly ON, viewport 1280x720. \`index.html\` is at the zip root and \`CONFIG.dev.enabled\` is false." \
            ${{ inputs.draft && '--draft' || '' }} \
            --target "${{ github.sha }}"
          echo "Release: $(gh release view "${{ inputs.tag }}" --json url --jq .url)"
