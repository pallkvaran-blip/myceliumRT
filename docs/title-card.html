<title>Mycelium — Chapter One</title>
<style>
  /* THE GAME'S OWN VALUES, not an approximation. Every number below is lifted from index.html so
     the recorded frames match the real title screen:
       background   #titleScreen's radial-gradient
       type stack   the title screen's font-family
       "chapter one" .ts-mode's metrics (tracking, 700, uppercase) in .li-sub's red #c0281f with
                    its glow — the game's own answer to "red text on this black", chosen there at
                    the light end of dark red because a true dark red loses contrast on it
       the wordmark growMyceliumTitle, unchanged: space colonization, ink rgba(233,255,247,0.9)
                    at 0.7px, composited 'lighter' with a 2.5px blur bloom at alpha 0.55
     No external requests of any kind — this is a strict-CSP page, and it is also what makes it
     safe to record offline. */
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; cursor: pointer; user-select: none;
    background: radial-gradient(125% 95% at 50% 40%, #0a1013 0%, #05080b 46%, #010203 100%);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  /* Full bleed and nothing else in frame: a GIF wants the art edge to edge with no chrome. */
  #stage { position: fixed; inset: 0; display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: clamp(10px, 2.4vh, 26px); }
  /* The wordmark's canvas takes its size from this box — growMyceliumTitle reads the container's
     rect and picks a font size from it, so the box IS the layout. */
  /* Sized so `titleSize` lands WIDTH-limited, as it does on the real title screen where the
     canvas is full-viewport: min(H*0.72, (W*0.78)/(8*0.62)). A shorter box makes it height-limited
     and the word comes out two-thirds the size (155px against the game's 232 at 1280x720).
     THE WIDTH FACTOR IS 0.78, NOT THE GAME'S 0.9, AND THAT IS THE M-CLIPPING FIX. `seed()`
     sprays 150 chains of attractors OUTWARD from the glyph edge and the mat follows them, so the
     DRAWN ink is wider than the text box — the factor has to leave room for the overspill, which
     the game's full-viewport canvas has and this box does not. Measured ink-to-edge gaps at
     630x500 / 900x900: 0.9 and 0.86 both touch both edges (0px), 0.82 is marginal (1px left),
     0.78 clears at 17/15 and 22/28. Raising it back is how the M's lose their outer strokes. */
  #word { width: min(1240px, 94vw); height: clamp(150px, 36vh, 360px); }
  .lines { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.4vh, 14px);
           opacity: 0; transition: opacity 900ms ease; }
  .lines.in { opacity: 1; }
  /* ONE LINE UNDER THE WORDMARK, in the game's red (owner: CAMPAIGN dropped, the chapter line
     carries it). Two stacked labels under a thumbnail-sized wordmark were competing for the same
     glance; one is stronger and leaves the mycelium the whole top of the frame.
     SIZED FOR A SMALL BOX, not for this window — the card goes on itch's game list, where a
     recording shows at a fraction of the size it was captured at, so it is set in `vw` with a
     generous floor and the whole composition scales as one. Not as large as CAMPAIGN was, because
     "-CHAPTER ONE-" is thirteen characters against nine: at 8vw with this tracking it runs to 95%
     of the frame width and reads as a bar rather than a line. 6.2vw puts it at about 74%.
     Tracking stays at .3em rather than CAMPAIGN's .4em for the same reason. */
  /* THE LETTERS ARE TWO COPIES, and neither one can do both jobs.
     BACK is the element itself: the dark edge and the glow. The edge is a STROKE UNDER A SECOND
     COPY, not a stroke on the visible letter — `-webkit-text-stroke` is centred on the outline, so
     stroking the letter you can see eats half its width back out of the fill and thickens the
     counters shut at this tracking. Under the fill, only the outer half shows and the letterform is
     untouched. #2b0906 rather than black: a near-black oxblood reads as ink pooling at the edge,
     where true black reads as a cartoon outline against a ground this dark.
     FRONT (::after, same glyphs via data-text) is the fill, and it is a BACKGROUND clipped to the
     glyphs rather than a flat colour — a vertical ramp (lit at the top, deep at the foot) multiplied
     by a mottle, so the red is textured and slightly eroded instead of a solid web red. The texture
     is a canvas painted at load into `--soon-tex` (see `mottleTexture` below), not an SVG
     `feTurbulence` filter: turbulence writes NOISE INTO THE ALPHA CHANNEL as well as the colour, and
     forcing alpha back to 1 afterwards un-premultiplies the dark pixels into much darker ones — the
     first version rendered the whole line as a near-black bevel. A canvas also lets the range be
     stated outright (mostly light, so multiply mottles rather than dims) and the tile be made
     seamless.
     THE RAMP IS WRITTEN IN hsl AND IT IS A BALANCE, NOT A DESCENT. It holds #c0281f's hue and runs
     56% -> 45% -> 33% lightness, which averages 44% against that red's own 41% — so once the texture
     has taken its ~10% off, the line still weighs what the game's flat red weighs and only its
     modelling has changed. The first version ran #e04a3c -> #7a1610, i.e. away from the red rather
     than around it: the top edge was the only bright part and every letter read as a dark shape
     with a red rim, which at thumbnail size is an outline font, not a lit one. Judge a change here
     by the MEAN, not by the stop colours.
     ORDER IS WHY THE FILL IS ::after AND NOT ::before. A negative-z-index child paints ABOVE its
     parent's background (the parent's background is step 1 of the stacking order, negative children
     step 3), so the obvious arrangement — textured background on the element, dark copy behind at
     z-index -1 — puts the dark copy ON TOP and the line renders as a near-black silhouette. A
     POSITIONED child paints above the parent's inline content, which is the ordering wanted here. */
  .soon { font-size: clamp(26px, 6.2vw, 92px); letter-spacing: .3em; text-indent: .3em; line-height: 1;
          text-transform: uppercase; font-weight: 700; position: relative;
          -webkit-text-stroke: 0.055em #2b0906; color: #2b0906;
          text-shadow: 0 0.03em 0.02em rgba(0, 0, 0, 0.85), 0 0 30px rgba(190, 30, 22, 0.5); }
  .soon::after { content: attr(data-text); position: absolute; inset: 0;
          /* THE LONGHAND, because `-webkit-text-stroke: 0` is an invalid shorthand and is dropped —
             after which the fill copy INHERITS the parent's 0.055em dark stroke and paints it over
             its own texture, leaving a sliver of red down the middle of every letter. */
          -webkit-text-stroke-width: 0; color: transparent;
          /* AND `text-shadow: none`, WHICH IS THE ONE THAT LOOKS LIKE IT CANNOT MATTER. The fill is
             a BACKGROUND, and a background paints BEFORE the element's inline content — so the dark
             drop this copy inherits from the parent lands on top of its own fill, offset down by
             0.03em, and every letter comes out near-black with a red rim along its top edge only.
             It reads exactly like the ramp being too dark, which is what it was misdiagnosed as. */
          text-shadow: none;
          -webkit-background-clip: text; background-clip: text;
          background-blend-mode: multiply;
          background-image: var(--soon-tex, none),
            linear-gradient(180deg, hsl(6 78% 56%) 0%, hsl(4 74% 45%) 45%, hsl(2 72% 33%) 100%);
          background-size: 220px 220px, 100% 100%; }
  /* If the clip is unsupported the fill copy would be invisible and only the dark edge would show. */
  @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
    .soon { color: #c0281f; }
    .soon::after { content: none; }
  }
  /* Only visible before the first click, and never once recording has started. */
  #hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
          font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
          color: rgba(219, 233, 223, 0.22); transition: opacity .4s ease; }
  #hint.gone { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .lines { transition: none; } }
</style>

<div id="stage">
  <div id="word"></div>
  <div class="lines" id="lines">
    <div class="soon" data-text="-chapter one-">-chapter one-</div>
  </div>
</div>
<div id="hint">click or press R to replay</div>

<script>
(function () {
  'use strict';
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ------------------------------------------------------------------------
  // The chapter line's fill texture: a mottled light grey tile, multiplied over the red ramp by
  // `.soon::after` so the letters read as stamped ink rather than flat colour.
  //
  // TWO SCALES, because one alone does nothing at the size this card is watched at. The blotches
  // (4-22% of the tile) are what survives a thumbnail and a GIF's palette; the per-pixel grain is
  // what stops the blotches looking like an airbrush up close, and on its own it would dither away
  // to an even tone the moment the recording is downscaled.
  //
  // IT IS A MULTIPLY MASK, SO IT LIVES IN THE TOP OF THE RANGE. White base, mostly-dark blotches at
  // 5-20% alpha and grain at +/-17/255: the darkest pixel takes about a third off the red beneath
  // and the median takes almost nothing. A texture centred on mid-grey would halve the line's
  // brightness and read as "the red went muddy", which is not texture.
  //
  // EACH BLOTCH IS DRAWN NINE TIMES, at every combination of -/0/+ one tile. The tile is 220px
  // against a line 506px wide at 630x500, so it repeats two and a bit times across the word and a
  // hard seam would fall inside a letter. Grain is per-pixel and wraps for free.
  function mottleTexture(size) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, size, size);
    for (let i = 0; i < 90; i++) {
      const bx = Math.random() * size, by = Math.random() * size;
      const r = rnd(size * 0.04, size * 0.22);
      const col = Math.random() < 0.62 ? '0,0,0' : '255,255,255';
      const a = rnd(0.05, 0.20);
      for (const dx of [-size, 0, size]) for (const dy of [-size, 0, size]) {
        const g = x.createRadialGradient(bx + dx, by + dy, 0, bx + dx, by + dy, r);
        g.addColorStop(0, 'rgba(' + col + ',' + a + ')');
        g.addColorStop(1, 'rgba(' + col + ',0)');
        x.fillStyle = g;
        x.beginPath(); x.arc(bx + dx, by + dy, r, 0, Math.PI * 2); x.fill();
      }
    }
    const im = x.getImageData(0, 0, size, size), d = im.data;
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() - 0.5) * 34;
      d[i] += n; d[i + 1] += n; d[i + 2] += n;
    }
    x.putImageData(im, 0, 0);
    return c.toDataURL('image/png');
  }
  document.documentElement.style.setProperty('--soon-tex', 'url(' + mottleTexture(220) + ')');

  // ------------------------------------------------------------------------
  // growMyceliumTitle, lifted from index.html with the game's audio hooks removed.
  // Space colonization: scatter attractors over the rendered word, grow a mat toward them,
  // kill each attractor once a node reaches it. The look is entirely in the compositing —
  // a blurred copy under a sharp one, both in 'lighter'.
  // ------------------------------------------------------------------------
  function growMyceliumTitle(container, opts) {
    opts = opts || {};
    const WORD = opts.word || 'MYCELIUM';
    const reduce = typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'display:block;width:100%;height:100%;';
    container.appendChild(canvas);
    const ctx = canvas.getContext('2d');

    let W = 0, H = 0, dpr = 1, ink = null, ictx = null;
    let titleSize = 0, cx = 0, cy = 0, g = null, raf = 0, stepAcc = 0, alive = true;
    const STEP_RATE = opts.stepRate || 2.4;

    // An INTEGER grid key, not "gx,gy". nearestNode probes nine buckets per attractor per step;
    // with ~28,000 attractors that was ~590,000 string builds a frame. Unique while |gy| < 32768,
    // which holds because gy is a grid ROW at a cell of titleSize * 0.05.
    const GK = (gx, gy) => gx * 65536 + gy;
    function grid(gr, x, y) { return GK((x / gr.cell) | 0, (y / gr.cell) | 0); }
    function addNode(gr, x, y, parent) {
      const i = gr.nodes.length; gr.nodes.push({ x: x, y: y, parent: parent });
      const k = grid(gr, x, y); let a = gr.map.get(k); if (!a) { a = []; gr.map.set(k, a); } a.push(i);
      return i;
    }
    function nearestNode(gr, x, y) {
      const cxg = (x / gr.cell) | 0, cyg = (y / gr.cell) | 0; let best = -1, bd = gr.attract2;
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
        const a = gr.map.get(GK(cxg + dx, cyg + dy)); if (!a) continue;
        for (const i of a) { const n = gr.nodes[i]; const d = (n.x - x) * (n.x - x) + (n.y - y) * (n.y - y); if (d < bd) { bd = d; best = i; } }
      }
      return best < 0 ? -1 : (gr._bd = bd, best);
    }
    function newGrowth() {
      const seg = Math.max(0.5, titleSize * 0.010), attract = titleSize * 0.05;
      return { nodes: [], segs: [], attractors: [], map: new Map(), seg: seg, attract: attract,
               attract2: attract * attract, kill2: seg * seg, cell: attract, _bd: 0, done: false };
    }
    function step(gr) {
      if (!gr.attractors.length || gr.nodes.length > 90000) { gr.done = true; return; }
      const infl = new Map(), survivors = [];
      for (const at of gr.attractors) {
        const ni = nearestNode(gr, at.x, at.y);
        if (ni < 0) { survivors.push(at); continue; }
        if (gr._bd <= gr.kill2) continue;
        survivors.push(at);
        const n = gr.nodes[ni]; let e = infl.get(ni); if (!e) { e = [0, 0]; infl.set(ni, e); }
        const dx = at.x - n.x, dy = at.y - n.y, L = Math.sqrt(dx * dx + dy * dy) || 1;
        e[0] += dx / L; e[1] += dy / L;
      }
      gr.attractors = survivors;
      for (const pair of infl) {
        const ni = pair[0], e = pair[1];
        const n = gr.nodes[ni]; let dx = e[0], dy = e[1];
        const L = Math.sqrt(dx * dx + dy * dy) || 1; dx /= L; dy /= L;
        const ja = rnd(-0.45, 0.45), c = Math.cos(ja), s = Math.sin(ja);
        const rx = dx * c - dy * s, ry = dx * s + dy * c;
        const nx = n.x + rx * gr.seg, ny = n.y + ry * gr.seg;
        addNode(gr, nx, ny, ni); gr.segs.push([n.x, n.y, nx, ny]);
      }
    }
    // Supersample small wordmarks so strand density tracks the font size rather than the canvas.
    function attractorsFromText(drawFn, stepPx, aMin, aMax, scale) {
      aMin = aMin == null ? 70 : aMin; aMax = aMax == null ? 256 : aMax; scale = scale || 1;
      const st = Math.max(2, Math.round(stepPx));
      const cw = Math.max(1, Math.round(W * scale)), ch = Math.max(1, Math.round(H * scale));
      const off = document.createElement('canvas'); off.width = cw; off.height = ch;
      const o = off.getContext('2d'); if (scale !== 1) o.scale(scale, scale); drawFn(o);
      const d = o.getImageData(0, 0, cw, ch).data, pts = [];
      for (let y = 0; y < ch; y += st) for (let x = 0; x < cw; x += st) {
        const a = d[(y * cw + x) * 4 + 3];
        if (a >= aMin && a < aMax) pts.push({ x: (x + rnd(-st / 2, st / 2)) / scale, y: (y + rnd(-st / 2, st / 2)) / scale });
      }
      return pts;
    }
    const font = (size) => '800 ' + size + 'px "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';

    function seed() {
      g = newGrowth();
      const S = Math.max(1, Math.min(4, Math.round(200 / titleSize)));
      const draw = (o, blur) => {
        if (blur) o.filter = 'blur(' + blur + 'px)';
        o.fillStyle = '#fff'; o.font = font(titleSize); o.textAlign = 'center'; o.textBaseline = 'middle';
        o.fillText(WORD, cx, cy);
      };
      const pts = attractorsFromText((o) => draw(o, 0), Math.max(2, Math.round(g.seg * 0.9)), 70, 256, S);
      g.attractors = pts;
      // ONE SEED PER LETTER, so the word grows across its whole width at once rather than
      // creeping in from one end.
      ctx.font = font(titleSize);
      const total = ctx.measureText(WORD).width, x0 = cx - total / 2; let prevW = 0;
      for (let i = 0; i < WORD.length; i++) {
        const w = ctx.measureText(WORD.slice(0, i + 1)).width; const lo = x0 + prevW, hi = x0 + w; prevW = w;
        const inL = pts.filter((pt) => pt.x >= lo && pt.x < hi);
        if (inL.length) { const s = inL[(Math.random() * inL.length) | 0]; addNode(g, s.x, s.y, -1); }
      }
      // A blurred pass at a LOW alpha window gives the fringe just outside the glyphs — the
      // cottony halo that stops the word reading as a solid stencil.
      const fringe = attractorsFromText((o) => draw(o, titleSize * 0.028), Math.max(4, g.seg * 3.5), 12, 100, S);
      for (const f of fringe) g.attractors.push(f);
      const edge = fringe.length ? fringe : pts, sp = g.attract * 0.6;
      for (let i = 0; i < 150; i++) {
        const s = edge[(Math.random() * edge.length) | 0]; if (!s) break;
        const ang = Math.atan2(s.y - cy, s.x - cx) + rnd(-0.7, 0.7), len = 1 + ((Math.random() * 2) | 0);
        let ex = s.x, ey = s.y;
        for (let k = 1; k <= len; k++) { ex = s.x + Math.cos(ang) * sp * k; ey = s.y + Math.sin(ang) * sp * k; g.attractors.push({ x: ex, y: ey }); }
        const br = 3 + ((Math.random() * 4) | 0);
        for (let bi = 0; bi < br; bi++) {
          const ba = ang + rnd(-1, 1), bl = g.attract * rnd(0.4, 0.95);
          g.attractors.push({ x: ex + Math.cos(ba) * bl, y: ey + Math.sin(ba) * bl });
          if (Math.random() < 0.35) g.attractors.push({ x: ex + Math.cos(ba) * bl * 1.6, y: ey + Math.sin(ba) * bl * 1.6 });
        }
      }
      if (reduce) { let guard = 0; while (!g.done && guard++ < 40000) step(g); flushInk(); }
    }

    function flushInk() {
      if (!g.segs.length) return;
      ictx.strokeStyle = 'rgba(233,255,247,0.9)'; ictx.lineWidth = 0.7 * dpr; ictx.lineCap = 'round';
      ictx.beginPath();
      for (const s of g.segs) { ictx.moveTo(s[0] * dpr, s[1] * dpr); ictx.lineTo(s[2] * dpr, s[3] * dpr); }
      ictx.stroke(); g.segs.length = 0;
    }
    function composite() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.filter = 'blur(' + (2.5 * dpr) + 'px)'; ctx.globalAlpha = 0.55; ctx.drawImage(ink, 0, 0);   // bloom
      ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.drawImage(ink, 0, 0);                              // sharp
      ctx.restore();
    }

    // `onGrown` fires ONCE, when the word has BLOOMED — not when the graph is done. Space
    // colonization trickles a few nodes ~forever as the mat wanders into scattered unreachable
    // attractors, so `g.done` is about a second late and the two lines would arrive after the
    // moment they belong to. Watching activity fall to a trickle relative to its peak is what the
    // game does, with a hard time cap as the backstop.
    let grownFired = false, peak = 0, quiet = 0, t0 = 0;
    function fireGrown() {
      if (grownFired) return; grownFired = true;
      try { opts.onGrown && opts.onGrown(); } catch (e) {}
    }
    function frame() {
      if (!alive) return;
      const before = g.nodes.length;
      stepAcc += STEP_RATE;
      while (stepAcc >= 1) { step(g); stepAcc -= 1; }
      flushInk(); composite();
      const grew = g.nodes.length - before;
      if (!grownFired) {
        if (grew > peak) peak = grew;
        if (!t0) t0 = performance.now();
        if (peak >= 20 && grew < Math.max(4, peak * 0.06)) { if (++quiet >= 10) fireGrown(); }
        else quiet = 0;
        if (performance.now() - t0 > 1800) fireGrown();
      }
      if (!g.done) raf = requestAnimationFrame(frame);
      else fireGrown();
    }
    function layout() {
      dpr = Math.min(2.5, window.devicePixelRatio || 1);
      const r = container.getBoundingClientRect();
      W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      ink = document.createElement('canvas'); ink.width = canvas.width; ink.height = canvas.height;
      ictx = ink.getContext('2d');
      titleSize = Math.min(H * 0.72, (W * 0.78) / (WORD.length * 0.62));
      cx = W / 2; cy = H * 0.52;
      seed(); composite();
    }

    layout();
    if (!reduce) raf = requestAnimationFrame(frame); else fireGrown();
    let rt = 0;
    const onResize = () => { clearTimeout(rt); rt = setTimeout(() => {
      if (!alive) return; cancelAnimationFrame(raf); layout(); if (!reduce) raf = requestAnimationFrame(frame);
    }, 200); };
    window.addEventListener('resize', onResize);
    return { destroy() { alive = false; cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); canvas.remove(); } };
  }

  // ------------------------------------------------------------------------
  const wordBox = document.getElementById('word');
  const lines = document.getElementById('lines');
  const hint = document.getElementById('hint');
  let title = null;

  function play() {
    if (title) title.destroy();
    lines.classList.remove('in');
    // Reflow between removing and re-adding the class, or the browser coalesces the two and the
    // fade never runs on a replay — the lines would simply be there.
    void lines.offsetWidth;
    title = growMyceliumTitle(wordBox, {
      word: 'MYCELIUM',
      stepRate: 2.4,
      // Close the gap BEFORE the fade starts, so the line arrives where it belongs rather than
      // sliding into place — `.lines` transitions opacity only, and a margin change is a jump.
      onGrown: () => { tightenToInk(); lines.classList.add('in'); },
    });
  }

  // ------------------------------------------------------------------------
  // THE GAP UNDER THE WORDMARK IS NOT THE CSS GAP, AND NO CSS VALUE CAN SET IT. `#word` is sized so
  // `titleSize` lands width-limited, which leaves the box TALLER than the ink inside it — measured
  // at 51px of empty box below the drawn ink at 630x500, 49 at 1280x720 and 107 at 900x900. So the
  // 12px `gap` on #stage was reading as 63, 66 and 129: not a constant, and not a fraction of the
  // box either, since how much slack there is depends on whether `titleSize` came out width- or
  // height-limited at that shape.
  //
  // The only thing that knows is the ink itself, so this measures the canvas and pulls `.lines` up
  // to leave a gap of a QUARTER OF THE INK'S OWN HEIGHT — a proportion, so the composition holds
  // together at any frame the card is recorded at.
  //
  // AND THEN RE-CENTRES, because #stage centres its CONTENT BOX and the content box includes that
  // dead slack. Pulling the line up shortens the column and flex obligingly slides everything down
  // by half of what was gained, which put the whole composition low in the frame. The transform
  // centres the union of (drawn ink, chapter line) — the thing actually on screen.
  function tightenToInk() {
    const canvas = wordBox.querySelector('canvas');
    if (!canvas) return;
    const px = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
    let top = canvas.height, bot = -1;
    for (let y = 0; y < canvas.height; y++) {
      const row = y * canvas.width * 4;
      for (let x = 0; x < canvas.width; x++) {
        if (px[row + x * 4 + 3] >= 24) { if (y < top) top = y; if (y > bot) bot = y; break; }
      }
    }
    if (bot < 0) return;                                  // nothing grown yet — leave the CSS alone

    const stage = document.getElementById('stage');
    stage.style.transform = '';
    lines.style.marginTop = '';
    const inkAt = () => {
      const wb = wordBox.getBoundingClientRect(), s = canvas.height / wb.height;
      return { top: wb.top + top / s, bot: wb.top + bot / s };
    };
    let ink = inkAt();
    const want = Math.max(10, (ink.bot - ink.top) * 0.25);
    lines.style.marginTop = (want - (lines.getBoundingClientRect().top - ink.bot)) + 'px';

    ink = inkAt();                                        // the pull moved #word: re-read, don't infer
    const mid = (ink.top + lines.getBoundingClientRect().bottom) / 2;
    stage.style.transform = 'translateY(' + (innerHeight / 2 - mid) + 'px)';
  }

  // REPLAY on click or R, because a GIF is recorded in several takes and reloading the page
  // costs a beat of white flash that ends up in the capture.
  const replay = () => { hint.classList.add('gone'); play(); };
  // Self-hide, so a capture started and left alone never has the hint in frame.
  setTimeout(() => hint.classList.add('gone'), 4000);
  addEventListener('pointerdown', replay);
  addEventListener('keydown', (e) => { if (e.key === 'r' || e.key === 'R') replay(); });
  play();
})();
</script>
