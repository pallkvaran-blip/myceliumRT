<meta charset="utf-8">
<title>Mycelium — analytics</title>
<style>
  :root { color-scheme: light dark;
    --bg:#0f1310; --panel:#161b17; --ink:#e9efe9; --dim:#93a498; --line:#28312b;
    --acc:#7fe6a3; --acc-dim:#2f6b4a; --warn:#e8a55f; --bad:#e8766c; --grid:#1e2621; }
  @media (prefers-color-scheme: light) { :root { --bg:#f7f9f7; --panel:#fff; --ink:#16201a;
    --dim:#5c6b62; --line:#e0e6e1; --acc:#1f7a52; --acc-dim:#bfe3ce; --warn:#a8571b;
    --bad:#b03a2c; --grid:#eef2ef; } }
  :root[data-theme="light"] { --bg:#f7f9f7; --panel:#fff; --ink:#16201a; --dim:#5c6b62;
    --line:#e0e6e1; --acc:#1f7a52; --acc-dim:#bfe3ce; --warn:#a8571b; --bad:#b03a2c; --grid:#eef2ef; }
  :root[data-theme="dark"] { --bg:#0f1310; --panel:#161b17; --ink:#e9efe9; --dim:#93a498;
    --line:#28312b; --acc:#7fe6a3; --acc-dim:#2f6b4a; --warn:#e8a55f; --bad:#e8766c; --grid:#1e2621; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:1220px; margin:0 auto; padding:24px 18px 80px; }
  h1 { font-size:23px; margin:0 0 3px; letter-spacing:-0.01em; text-wrap:balance; }
  .sub { color:var(--dim); margin:0 0 18px; font-size:13.5px; }
  h2 { font-size:12px; letter-spacing:0.07em; text-transform:uppercase; color:var(--dim);
    margin:26px 0 10px; font-weight:600; }
  .bar { display:flex; flex-wrap:wrap; gap:7px; align-items:center; padding:10px 0;
    border-bottom:1px solid var(--line); margin-bottom:14px; }
  .chip { border:1px solid var(--line); background:var(--panel); color:var(--dim); font:inherit;
    font-size:12.5px; border-radius:999px; padding:4px 11px; cursor:pointer; }
  .chip.on { background:var(--acc); border-color:var(--acc); color:var(--bg); font-weight:600; }
  .grp { display:flex; gap:5px; align-items:center; margin-right:6px; }
  .grp b { font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:var(--dim); font-weight:600; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:10px; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px 15px; }
  .kpi .v { font-size:26px; font-weight:650; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
  .kpi .k { font-size:11.5px; color:var(--dim); margin-top:1px; }
  .kpi .note { font-size:11px; color:var(--dim); margin-top:5px; opacity:0.8; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:860px) { .row2 { grid-template-columns:1fr; } }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { text-align:left; padding:5px 8px 5px 0; border-bottom:1px solid var(--grid); }
  th { font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:var(--dim); font-weight:600; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .scroll { overflow-x:auto; }
  .track { position:relative; height:20px; background:var(--grid); border-radius:4px; overflow:hidden; }
  .fill { position:absolute; inset:0 auto 0 0; background:var(--acc); opacity:0.55; }
  .fill.warn { background:var(--warn); }
  .fill.bad { background:var(--bad); }
  .track span { position:absolute; left:7px; top:0; line-height:20px; font-size:11.5px;
    font-variant-numeric:tabular-nums; color:var(--ink); }
  .empty { color:var(--dim); font-size:13px; padding:10px 0; }
  .caveat { background:#fff6e5; border:1px solid #e8c98a; border-left:4px solid #d8a13a;
            color:#6b4c12; font-size:13px; line-height:1.5; padding:10px 13px; border-radius:6px; margin:0 0 14px; }
  .caveat b { color:#4a340a; }
  .err { color:var(--bad); font-size:13px; }
  .foot { color:var(--dim); font-size:12px; margin-top:26px; border-top:1px solid var(--line); padding-top:12px; }
  .foot code { background:var(--grid); padding:1px 5px; border-radius:4px; }
  canvas { width:100%; height:110px; display:block; }
  :is(button,select,a):focus-visible { outline:2px solid var(--acc); outline-offset:2px; border-radius:6px; }
</style>
<div class="wrap">
<h1>Mycelium — analytics</h1>
<p class="sub" id="sub">Loading…</p>
<div class="bar" id="bar"></div>
<div id="body"></div>
<p class="foot" id="foot"></p>
</div>
<script>
var SUPABASE_URL = "https://daebrdzdoewpuedhxwud.supabase.co";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhZWJyZHpkb2V3cHVlZGh4d3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NzcwNDAsImV4cCI6MjEwMDI1MzA0MH0.sOYQLy4_IedoR3mEX_-kxheXvRUYt3N4evxz_wUU8Uw";
var CAMPAIGN_LEVELS = 9;
var SNAPSHOT = null;
var SNAPSHOT_AT = null;

var ROWS = [];
var FILTER = { days: 30, build: "", source: "itch", game: "", mode: "", device: "" };

// PostgREST CAPS A GET AT 1000 ROWS and says nothing about it, so a naive fetch silently
// analyses the first thousand events and reports them as the whole story. Paged with
// Range headers until a short page comes back.
function fetchAll(onProgress) {
  if (SNAPSHOT) return Promise.resolve(SNAPSHOT.slice());
  var out = [], PAGE = 1000, MAX = 200000;
  function step(from) {
    var url = SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/events?select=*&order=created_at.desc";
    return fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY,
      Range: from + "-" + (from + PAGE - 1), "Range-Unit": "items" } })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status + " — " + (r.status === 404 ? "the events table does not exist yet (see docs/leaderboard-setup.md)" : r.statusText));
        return r.json();
      })
      .then(function (batch) {
        out = out.concat(batch);
        if (onProgress) onProgress(out.length);
        if (batch.length < PAGE || out.length >= MAX) return out;
        return step(from + PAGE);
      });
  }
  return step(0);
}

// ---- helpers ---------------------------------------------------------------
function el(t, cls, txt) { var n = document.createElement(t); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; }
function uniq(a) { var s = {}; var o = []; for (var i = 0; i < a.length; i++) if (a[i] != null && !s[a[i]]) { s[a[i]] = 1; o.push(a[i]); } return o; }
function pct(a, b) { return b ? Math.round((a / b) * 1000) / 10 : 0; }
function dayOf(r) { return String(r.created_at || "").slice(0, 10); }
function fmtMs(ms) {
  if (ms == null) return "–";
  var s = Math.round(ms / 1000);
  if (s < 90) return s + "s";
  var m = Math.round(s / 60);
  return m < 90 ? m + "m" : (Math.round(m / 6) / 10) + "h";
}
function median(a) { if (!a.length) return null; var s = a.slice().sort(function (x, y) { return x - y; }); var m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }

// WHICH BUILD A ROW CAME FROM IS NOT A TIMESTAMP, IT IS THE COLUMN SET. itch serves whatever
// zip was last uploaded and a browser can hold a cached copy of the old one for days, so a
// date cut would file an old-build session under "after" purely because it was played late.
// `game`/`mode`/`device` are attached centrally in `buildEventRow` and exist only in the new
// build, so their PRESENCE is the build stamp. (`_slimEvents` would strip them after a 400 on
// an un-migrated table — that would misfile a new row as old, and the table is migrated.)
function isNewBuild(r) { return r.device != null && r.game != null; }

// `source` WAS ADDED LATE TOO, and unlike the build columns it has its own chip — so an untagged
// row is invisible rather than merely unattributed. SRC_NONE is the bucket that makes it clickable.
var SRC_NONE = "__none";

function inFilter(r, skipSource) {
  if (FILTER.build === "new" && !isNewBuild(r)) return false;
  if (FILTER.build === "old" && isNewBuild(r)) return false;
  if (!skipSource) {
    if (FILTER.source === SRC_NONE) { if (r.source != null) return false; }
    else if (FILTER.source && r.source !== FILTER.source) return false;
  }
  if (FILTER.game && r.game !== FILTER.game) return false;
  if (FILTER.mode && r.mode !== FILTER.mode) return false;
  if (FILTER.device && r.device !== FILTER.device) return false;
  if (FILTER.days) {
    var cut = Date.now() - FILTER.days * 86400000;
    if (new Date(r.created_at).getTime() < cut) return false;
  }
  return true;
}

function kpi(host, value, label, note) {
  var b = el("div", "kpi");
  b.appendChild(el("div", "v", value));
  b.appendChild(el("div", "k", label));
  if (note) b.appendChild(el("div", "note", note));
  host.appendChild(b);
  return b;
}
// `of` sizes the bar. `rate` says whether `of` is a real DENOMINATOR (so a percentage means
// something) or merely the biggest value in the column (so it does not). Printing "88.9%" beside
// a bar scaled to the leader reads as a rate and is not one — the first render of this page said
// 8 retries on level 1 was "88.9%" of nothing in particular.
function barRow(host, label, value, of, cls, rate) {
  var tr = el("tr");
  tr.appendChild(el("td", "", label));
  var td = el("td"); td.style.width = "62%";
  var tk = el("div", "track");
  var f = el("div", "fill" + (cls ? " " + cls : "")); f.style.width = (of ? (value / of) * 100 : 0) + "%";
  tk.appendChild(f);
  tk.appendChild(el("span", "", value + (rate && of ? "  ·  " + pct(value, of) + "%" : "")));
  td.appendChild(tk); tr.appendChild(td);
  host.appendChild(tr);
}
function section(title) { var h = el("h2", "", title); document.getElementById("body").appendChild(h); return h; }
function panel() { var p = el("div", "panel"); document.getElementById("body").appendChild(p); return p; }
function table(host, cols) {
  var wrap = el("div", "scroll"), t = el("table"), thead = el("thead"), tr = el("tr");
  for (var i = 0; i < cols.length; i++) { var th = el("th", cols[i].n ? "n" : "", cols[i].t || cols[i]); tr.appendChild(th); }
  thead.appendChild(tr); t.appendChild(thead);
  var tb = el("tbody"); t.appendChild(tb); wrap.appendChild(t); host.appendChild(wrap);
  return tb;
}
function trow(tb, cells) {
  var tr = el("tr");
  for (var i = 0; i < cells.length; i++) {
    var c = cells[i];
    tr.appendChild(el("td", (c && c.n) ? "n" : "", (c && c.t != null) ? String(c.t) : String(c)));
  }
  tb.appendChild(tr);
  return tr;
}

// ---- the dashboard ---------------------------------------------------------
function render() {
  var body = document.getElementById("body");
  body.innerHTML = "";
  var rows = ROWS.filter(function (r) { return inFilter(r); });
  var of = function (k) { return rows.filter(function (r) { return r.kind === k; }); };

  // A SOURCE FILTER SILENTLY DROPS THE ERA BEFORE `source` EXISTED, and that era is the game's
  // first week on itch — by far the biggest block of real play in the table. Picking `itch` and
  // reading the all-time number is then wrong by that whole population with nothing on screen to
  // say so, which is exactly how a launch number convinces you the game has a sixth of the
  // players it has. The banner is not a style choice: an untagged row is invisible in every chip.
  if (FILTER.source && FILTER.source !== SRC_NONE) {
    var missed = ROWS.filter(function (r) { return r.source == null && inFilter(r, 1); });
    if (missed.length) {
      var mDev = uniq(missed.map(function (r) { return r.client_id; })).length;
      var mDay = missed.map(dayOf).sort();
      var c = el("div", "caveat");
      c.innerHTML = "<b>" + missed.length + " events in this window carry no source</b> (" + mDay[0]
        + " \u2192 " + mDay[mDay.length - 1] + ", " + mDev + " device" + (mDev === 1 ? "" : "s")
        + ") and are NOT counted below. Tagging was added after launch, so everything before it is"
        + " untagged whatever it was \u2014 including the first week on itch. Source"
        + " <b>untagged</b> shows just that era, <b>all</b> shows everything.";
      body.appendChild(c);
    }
  }

  if (!rows.length) {
    body.appendChild(el("p", "empty", ROWS.length
      ? "No events match these filters. " + ROWS.length + " rows loaded — try Source: all, or a wider window."
      : "No events yet. Once the game is live and someone plays it, this fills in."));
    return;
  }

  // ---- the funnel, which is the point of `boot` ----------------------------
  section("The funnel");
  var pboot = panel(); pboot.style.marginBottom = "10px";
  var kc = el("div", "cards"); pboot.appendChild(kc);
  var boots = of("boot"), players = uniq(rows.map(function (r) { return r.client_id; }));
  var sessions = uniq(rows.map(function (r) { return r.session_id; }));
  var starts = of("run_start"), ends = of("run_end");
  var pickers = uniq(of("picker").map(function (r) { return r.session_id; }));
  kpi(kc, String(players.length), "players", "distinct devices");
  kpi(kc, String(sessions.length), "sessions", boots.length + " reached playable");
  // `boot` IS THE DENOMINATOR ONLY IF THE BUILD SENT ONE. The pre-v2 itch build did not, so an
  // all-time itch view had 44 sessions behind 1 boot and this printed "6900% of boots" — a number
  // that reads as a bug in the game rather than in its own denominator. Refuse the rate instead,
  // the same way "more ends than starts" already does one line below.
  var bootsShort = boots.length < sessions.length;
  kpi(kc, String(starts.length), "runs started",
      bootsShort ? boots.length + " of " + sessions.length + " sessions sent a boot"
                 : pct(starts.length, boots.length) + "% of boots");
  kpi(kc, String(ends.length), "runs ended",
      starts.length ? (ends.length > starts.length ? "more ends than starts — check run_start" : pct(ends.length, starts.length) + "% of starts") : "");
  kpi(kc, fmtMs(median(of("boot").map(function (r) { return r.ms; }).filter(function (v) { return v != null; }))), "median load", "to playable");
  var sess = of("session_end").map(function (r) { return r.ms; }).filter(function (v) { return v != null; });
  kpi(kc, fmtMs(median(sess)), "median session", sess.length + " measured");
  var pf = panel();
  var ft = table(pf, ["step", "reach"]);
  // AND THE FUNNEL FALLS BACK TO SESSIONS WHEN IT HAS TO. The old `|| sessions.length` only
  // caught ZERO boots — one boot passed it and became the denominator for forty-four sessions,
  // which is how every row below read in the thousands of percent. A denominator smaller than the
  // population it is supposed to cover is not a denominator.
  var bootSessions = uniq(boots.map(function (r) { return r.session_id; })).length;
  var funnelBase = bootSessions < sessions.length ? sessions.length : bootSessions;
  if (bootSessions < sessions.length) {
    pf.appendChild(el("p", "empty", "Shares are of SESSIONS, not of boots: only " + bootSessions
      + " of " + sessions.length + " sessions sent a `boot` event. The build before boot telemetry"
      + " existed did not send one, so a boot-based funnel would be over a denominator that is"
      + " missing most of its population."));
  }
  barRow(ft, bootSessions < sessions.length ? "sessions" : "loaded and playable", funnelBase, funnelBase, "", 1);
  barRow(ft, "opened the species screen", pickers.length, funnelBase, "", 1);
  barRow(ft, "started a run", uniq(starts.map(function (r) { return r.session_id; })).length, funnelBase, "", 1);
  barRow(ft, "cleared a level", uniq(of("level_clear").map(function (r) { return r.session_id; })).length, funnelBase, "", 1);

  // ---- HOW FAR PEOPLE GET (the owner's headline question) ------------------
  section("How far people get");
  var pc = panel();
  var camp = rows.filter(function (r) { return r.game === "campaign"; });
  var starts2 = camp.filter(function (r) { return r.kind === "level_start"; });
  var clears = camp.filter(function (r) { return r.kind === "level_clear"; });
  if (!starts2.length) pc.appendChild(el("p", "empty", "No campaign levels started in this window."));
  else {
    var lt = table(pc, ["level", { t: "attempts", n: 1 }, { t: "cleared", n: 1 }, { t: "clear rate", n: 1 }, "reached (share of runs)"]);
    var runsSeen = uniq(camp.filter(function (r) { return r.kind === "run_start"; }).map(function (r) { return r.session_id + "|" + r.client_id; })).length;
    var lvl1 = starts2.filter(function (r) { return r.level === 1; }).length || starts2.length;
    for (var L = 1; L <= CAMPAIGN_LEVELS; L++) {
      var att = starts2.filter(function (r) { return r.level === L; }).length;
      var cl = clears.filter(function (r) { return r.level === L; }).length;
      var tr = el("tr");
      tr.appendChild(el("td", "", "Level " + L));
      tr.appendChild(el("td", "n", String(att)));
      tr.appendChild(el("td", "n", String(cl)));
      tr.appendChild(el("td", "n", att ? pct(cl, att) + "%" : "–"));
      var td = el("td"); td.style.width = "44%";
      var tk = el("div", "track");
      var f = el("div", "fill" + (att && pct(cl, att) < 35 ? " bad" : (att && pct(cl, att) < 60 ? " warn" : "")));
      f.style.width = (lvl1 ? (att / lvl1) * 100 : 0) + "%";
      tk.appendChild(f); tk.appendChild(el("span", "", pct(att, lvl1) + "% of level-1 attempts"));
      td.appendChild(tk); tr.appendChild(td);
      lt.appendChild(tr);
    }
    var finished = camp.filter(function (r) { return r.kind === "run_end" && r.cause === "won" && r.level >= CAMPAIGN_LEVELS; }).length;
    var campEnds = camp.filter(function (r) { return r.kind === "run_end"; }).length;
    var note = el("p", "empty", "Campaign finished " + finished + " time(s)"
      + (campEnds ? " — " + pct(finished, campEnds) + "% of campaign runs that ended" : "")
      + ". A level whose clear rate is under 35% is red, under 60% amber.");
    pc.appendChild(note);
  }

  // ---- deaths ---------------------------------------------------------------
  var p2 = el("div", "row2"); document.getElementById("body").appendChild(p2);
  var pd = el("div", "panel"); p2.appendChild(pd);
  pd.appendChild(el("h2", "", "What ends a run")).style.margin = "0 0 8px";
  var causes = {};
  ends.forEach(function (r) { causes[r.cause || "?"] = (causes[r.cause || "?"] || 0) + 1; });
  var ck = Object.keys(causes).sort(function (a, b) { return causes[b] - causes[a]; });
  if (!ck.length) pd.appendChild(el("p", "empty", "No runs have ended in this window."));
  else { var ct = table(pd, ["cause", "runs"]); ck.forEach(function (k) { barRow(ct, k, causes[k], ends.length, k === "won" ? "" : (k === "abandon" ? "warn" : "bad"), 1); }); }
  var pr = el("div", "panel"); p2.appendChild(pr);
  pr.appendChild(el("h2", "", "Retries")).style.margin = "0 0 8px";
  var retries = of("retry");
  if (!retries.length) pr.appendChild(el("p", "empty", "No retries used in this window — nobody bought one, or nobody needed one."));
  else {
    // Per ATTEMPT, which is the question ("how often does this level need a second go?"). Scaled
    // to the biggest bar it would only say which level has the most retries in absolute terms —
    // mostly a statement about how many people reach it at all.
    var rt = table(pr, ["level", "retries per attempt"]);
    var byL = {}; retries.forEach(function (r) { byL[r.level] = (byL[r.level] || 0) + 1; });
    var attL = {}; rows.filter(function (r) { return r.kind === "level_start"; }).forEach(function (r) { attL[r.level] = (attL[r.level] || 0) + 1; });
    Object.keys(byL).sort(function (a, b) { return a - b; }).forEach(function (k) {
      barRow(rt, "Level " + k, byL[k], attL[k] || byL[k], "warn", 1);
    });
  }

  // ---- DEVICES --------------------------------------------------------------
  section("Devices");
  var pdv = panel();
  var devs = uniq(rows.map(function (r) { return r.device; })).sort();
  // AN EXPLICIT UNKNOWN BUCKET, because `uniq` drops nulls and a PRE-v2 row carries no `device`.
  // Without it the listed devices covered fewer sessions than `allSessions` and the share column
  // quietly summed to under 100 — the same defect the player-vs-session fix below was for, and it
  // arrives on its own the moment an old build and a new one are both in the table.
  if (rows.some(function (r) { return r.device == null; })) devs.push(null);
  var dt = table(pdv, ["device", { t: "players", n: 1 }, { t: "sessions", n: 1 }, { t: "runs", n: 1 },
    { t: "levels cleared", n: 1 }, { t: "median frame", n: 1 }, "share of sessions"]);
  // SHARE OF SESSIONS, not of players. A device id is a browser, and a browser whose window is
  // resized across a bucket boundary legitimately appears under two device classes — so the
  // player shares summed to over 100% on the first render of this page. A session is the honest
  // unit, and it is also the one a per-device rate should be against.
  var allSessions = sessions.length;
  devs.forEach(function (d) {
    var sub = rows.filter(function (r) { return d == null ? r.device == null : r.device === d; });
    var pl = uniq(sub.map(function (r) { return r.client_id; })).length;
    var perfs = sub.filter(function (r) { return r.kind === "perf" && r.ms != null; }).map(function (r) { return r.ms / 10; });
    var tr = el("tr");
    tr.appendChild(el("td", "", d || "unknown"));
    tr.appendChild(el("td", "n", String(pl)));
    tr.appendChild(el("td", "n", String(uniq(sub.map(function (r) { return r.session_id; })).length)));
    tr.appendChild(el("td", "n", String(sub.filter(function (r) { return r.kind === "run_start"; }).length)));
    tr.appendChild(el("td", "n", String(sub.filter(function (r) { return r.kind === "level_clear"; }).length)));
    var md = median(perfs);
    tr.appendChild(el("td", "n", md == null ? "–" : (Math.round(md * 10) / 10) + " ms"));
    var td = el("td"); td.style.width = "34%";
    var ss = uniq(sub.map(function (r) { return r.session_id; })).length;
    var tk = el("div", "track"); var f = el("div", "fill"); f.style.width = (allSessions ? (ss / allSessions) * 100 : 0) + "%";
    tk.appendChild(f); tk.appendChild(el("span", "", pct(ss, allSessions) + "%"));
    td.appendChild(tk); tr.appendChild(td);
    dt.appendChild(tr);
  });
  var slow = rows.filter(function (r) { return r.kind === "perf" && r.cause === "bad"; }).length;
  var perfN = rows.filter(function (r) { return r.kind === "perf"; }).length;
  pdv.appendChild(el("p", "empty", perfN
    ? slow + " of " + perfN + " perf samples were in the \u201cbad\u201d bucket (median frame over 20 ms)."
    : "No perf samples yet — one is taken per session after 90 frames."));

  // ---- RETENTION ------------------------------------------------------------
  section("Coming back");
  var prt = panel();
  // First-seen day per device, over the WHOLE table rather than the filtered window: a cohort
  // is about a player's history, and clipping it to 30 days would call every older player new.
  var first = {}, seen = {};
  ROWS.forEach(function (r) {
    var d = dayOf(r), c = r.client_id;
    if (!c || !d) return;
    if (!first[c] || d < first[c]) first[c] = d;
    (seen[c] || (seen[c] = {}))[d] = 1;
  });
  var dayMs = 86400000;
  var cohorts = {};
  Object.keys(first).forEach(function (c) {
    var f = first[c];
    var row = cohorts[f] || (cohorts[f] = { n: 0, d1: 0, d3: 0, d7: 0 });
    row.n++;
    var t0 = new Date(f + "T00:00:00Z").getTime();
    var days = Object.keys(seen[c]);
    for (var i = 0; i < days.length; i++) {
      var k = Math.round((new Date(days[i] + "T00:00:00Z").getTime() - t0) / dayMs);
      if (k === 1) row.d1++;
      if (k === 3) row.d3++;
      if (k === 7) row.d7++;
    }
  });
  var ckeys = Object.keys(cohorts).sort().reverse().slice(0, 14);
  if (!ckeys.length) prt.appendChild(el("p", "empty", "Not enough history yet."));
  else {
    var rtb = table(prt, ["first seen", { t: "new players", n: 1 }, { t: "day 1", n: 1 }, { t: "day 3", n: 1 }, { t: "day 7", n: 1 }]);
    ckeys.forEach(function (d) {
      var c = cohorts[d];
      trow(rtb, [d, { t: c.n, n: 1 }, { t: c.n ? pct(c.d1, c.n) + "%" : "–", n: 1 },
        { t: c.n ? pct(c.d3, c.n) + "%" : "–", n: 1 }, { t: c.n ? pct(c.d7, c.n) + "%" : "–", n: 1 }]);
    });
    prt.appendChild(el("p", "empty", "A cohort is every device first seen on that day; the columns are the share that came back on exactly day 1, 3 and 7. Cohorts younger than N days cannot have a day-N number yet."));
  }
  // Players per day — the shape everything else sits on.
  var pday = panel(); pday.style.marginTop = "10px";
  pday.appendChild(el("h2", "", "Players per day")).style.margin = "0 0 8px";
  var byDay = {};
  rows.forEach(function (r) { var d = dayOf(r); if (!d) return; (byDay[d] || (byDay[d] = {}))[r.client_id] = 1; });
  var dk = Object.keys(byDay).sort();
  if (dk.length < 2) pday.appendChild(el("p", "empty", "One day of data so far."));
  else {
    var cv = el("canvas"); cv.width = 1100; cv.height = 110; pday.appendChild(cv);
    var ctx = cv.getContext("2d");
    var vals = dk.map(function (d) { return Object.keys(byDay[d]).length; });
    var mx2 = Math.max.apply(null, vals) || 1;
    var w = cv.width / vals.length;
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--acc").trim() || "#7fe6a3";
    for (var i = 0; i < vals.length; i++) {
      var h = Math.max(2, (vals[i] / mx2) * (cv.height - 16));
      ctx.globalAlpha = 0.55; ctx.fillRect(i * w + 1, cv.height - h, Math.max(1, w - 2), h);
    }
    ctx.globalAlpha = 1;
    pday.appendChild(el("p", "empty", dk[0] + " → " + dk[dk.length - 1] + "  ·  peak " + mx2 + " players in a day"));
  }

  // ---- TUTORIAL -------------------------------------------------------------
  section("Tutorial");
  var pt = panel();
  var tut = of("tutorial");
  if (!tut.length) pt.appendChild(el("p", "empty", "No tutorial events in this window."));
  else {
    var startsT = tut.filter(function (r) { return r.detail === "start"; }).length;
    var doneT = tut.filter(function (r) { return r.detail === "done"; }).length;
    var skipT = tut.filter(function (r) { return r.detail === "skip"; }).length;
    var kt = el("div", "cards"); pt.appendChild(kt); kt.style.marginBottom = "12px";
    kpi(kt, String(startsT), "started");
    kpi(kt, pct(doneT, startsT) + "%", "finished it", doneT + " of " + startsT);
    kpi(kt, pct(skipT, startsT) + "%", "pressed End", skipT + " of " + startsT);
    var steps = {};
    tut.filter(function (r) { return r.detail === "step"; }).forEach(function (r) { steps[r.n] = (steps[r.n] || 0) + 1; });
    var sk = Object.keys(steps).sort(function (a, b) { return a - b; });
    if (sk.length) {
      var stt = table(pt, ["step", "reached"]);
      var top = steps[sk[0]] || 1;
      sk.forEach(function (k) { barRow(stt, "Step " + (+k + 1), steps[k], top); });
      pt.appendChild(el("p", "empty", "The step where this falls off a cliff is the one to rewrite."));
    }
  }

  // ---- ECONOMY --------------------------------------------------------------
  section("Spores, the store and the deck");
  var p3 = el("div", "row2"); document.getElementById("body").appendChild(p3);
  var pe = el("div", "panel"); p3.appendChild(pe);
  pe.appendChild(el("h2", "", "Earned vs spent")).style.margin = "0 0 8px";
  var earned = ends.reduce(function (a, r) { return a + (r.n || 0); }, 0);
  var spentU = of("upgrade").reduce(function (a, r) { return a + (r.n || 0); }, 0);
  var spentS = of("purchase").reduce(function (a, r) { return a + (r.n || 0); }, 0);
  var ke = el("div", "cards"); pe.appendChild(ke);
  kpi(ke, String(earned), "spores earned", ends.length + " runs");
  kpi(ke, String(spentU + spentS), "spores spent", of("upgrade").length + " upgrades, " + of("purchase").length + " colonies");
  kpi(ke, earned ? pct(spentU + spentS, earned) + "%" : "–", "of earnings spent",
      (spentU + spentS) > earned ? "spending exceeds the window\u2019s earnings — older balances" : "");
  var pu = el("div", "panel"); p3.appendChild(pu);
  pu.appendChild(el("h2", "", "Which upgrades")).style.margin = "0 0 8px";
  var ups = {};
  of("upgrade").forEach(function (r) { ups[r.detail || "?"] = (ups[r.detail || "?"] || 0) + 1; });
  var uk = Object.keys(ups).sort(function (a, b) { return ups[b] - ups[a]; });
  if (!uk.length) pu.appendChild(el("p", "empty", "Nobody has bought an upgrade in this window."));
  else { var ut = table(pu, ["track", "bought"]); uk.forEach(function (k) { barRow(ut, k, ups[k], ups[uk[0]]); }); }
  var pdk = panel(); pdk.style.marginTop = "10px";
  pdk.appendChild(el("h2", "", "Cards carried out of a run")).style.margin = "0 0 8px";
  var deck = of("deck").map(function (r) { return r.n || 0; });
  if (!deck.length) pdk.appendChild(el("p", "empty", "No deck picks recorded yet."));
  else pdk.appendChild(el("p", "empty", "median " + median(deck) + "  ·  max " + Math.max.apply(null, deck) + "  ·  " + deck.filter(function (v) { return v === 0; }).length + " kept nothing, of " + deck.length));

  // ---- THE RATING ASK -------------------------------------------------------
  section("The rating ask");
  var pra = panel();
  var shown = of("rate").filter(function (r) { return r.detail === "shown"; }).length;
  var pressed = of("rate").filter(function (r) { return r.detail === "press"; }).length;
  var declined = of("rate").filter(function (r) { return r.detail === "decline"; }).length;
  if (!shown && !pressed) pra.appendChild(el("p", "empty", "The ask has not been shown in this window. It only appears after a player has finished a run."));
  else {
    var kr = el("div", "cards"); pra.appendChild(kr);
    kpi(kr, String(shown), "times shown");
    kpi(kr, pct(pressed, shown) + "%", "pressed Rate", pressed + " of " + shown);
    kpi(kr, pct(declined, shown) + "%", "no thanks", declined + " of " + shown);
  }

  // ---- SPECIES + DRAFTS ---------------------------------------------------
  section("Colonies and cards");
  var p4 = el("div", "row2"); document.getElementById("body").appendChild(p4);
  var psp = el("div", "panel"); p4.appendChild(psp);
  psp.appendChild(el("h2", "", "Colonies played")).style.margin = "0 0 8px";
  var sp = {}, spWin = {};
  starts.forEach(function (r) { if (r.species) sp[r.species] = (sp[r.species] || 0) + 1; });
  ends.forEach(function (r) { if (r.species && r.cause === "won") spWin[r.species] = (spWin[r.species] || 0) + 1; });
  var spk = Object.keys(sp).sort(function (a, b) { return sp[b] - sp[a]; });
  if (!spk.length) psp.appendChild(el("p", "empty", "No runs in this window."));
  else {
    var spt = table(psp, ["colony", { t: "runs", n: 1 }, { t: "wins", n: 1 }, "share"]);
    spk.forEach(function (k) {
      var tr = el("tr");
      tr.appendChild(el("td", "", k));
      tr.appendChild(el("td", "n", String(sp[k])));
      tr.appendChild(el("td", "n", String(spWin[k] || 0)));
      var td = el("td"); td.style.width = "46%";
      var tk = el("div", "track"); var f = el("div", "fill"); f.style.width = (sp[k] / sp[spk[0]]) * 100 + "%";
      tk.appendChild(f); tk.appendChild(el("span", "", pct(sp[k], starts.length) + "% of runs"));
      td.appendChild(tk); tr.appendChild(td); spt.appendChild(tr);
    });
  }
  var pcd = el("div", "panel"); p4.appendChild(pcd);
  pcd.appendChild(el("h2", "", "Most-drafted cards")).style.margin = "0 0 8px";
  var cards = {};
  of("draft").forEach(function (r) { cards[r.detail || "?"] = (cards[r.detail || "?"] || 0) + 1; });
  var cdk = Object.keys(cards).sort(function (a, b) { return cards[b] - cards[a]; }).slice(0, 12);
  if (!cdk.length) pcd.appendChild(el("p", "empty", "No drafts recorded in this window."));
  else { var cdt = table(pcd, ["card", "taken"]); cdk.forEach(function (k) { barRow(cdt, k, cards[k], cards[cdk[0]]); }); }
}

// ---- filters ---------------------------------------------------------------
function buildBar() {
  var bar = document.getElementById("bar");
  bar.innerHTML = "";
  function group(label, key, opts) {
    var g = el("div", "grp");
    g.appendChild(el("b", "", label));
    opts.forEach(function (o) {
      var b = el("button", "chip" + (FILTER[key] === o.v ? " on" : ""), o.t);
      b.dataset.f = key; b.dataset.v = String(o.v);
      b.addEventListener("click", function () { FILTER[key] = o.v; buildBar(); render(); });
      g.appendChild(b);
    });
    bar.appendChild(g);
  }
  group("Window", "days", [{ t: "1d", v: 1 }, { t: "7d", v: 7 }, { t: "30d", v: 30 }, { t: "90d", v: 90 }, { t: "all", v: 0 }]);
  // BUILD IS NOT A DATE — see isNewBuild. Pair "after update" with Window "all", or a 30d
  // window silently clips the comparison to whichever side of the launch fits in 30 days.
  group("Build", "build", [{ t: "all", v: "" }, { t: "after update", v: "new" }, { t: "before update", v: "old" }]);
  // SOURCE DEFAULTS TO `itch`, and that is deliberate: the same table carries dev boots and
  // Playwright runs, and mixing them into a launch number is how you convince yourself the game
  // has ten times the players it has.
  var srcs = uniq(ROWS.map(function (r) { return r.source; })).sort();
  var srcOpts = [{ t: "all", v: "" }].concat(srcs.map(function (s) { return { t: s, v: s }; }));
  if (ROWS.some(function (r) { return r.source == null; })) srcOpts.push({ t: "untagged", v: SRC_NONE });
  group("Source", "source", srcOpts);
  group("Game", "game", [{ t: "both", v: "" }, { t: "campaign", v: "campaign" }, { t: "survival", v: "survival" }]);
  group("Mode", "mode", [{ t: "both", v: "" }, { t: "turn", v: "turn" }, { t: "real time", v: "realtime" }]);
  var devs = uniq(ROWS.map(function (r) { return r.device; })).sort();
  group("Device", "device", [{ t: "all", v: "" }].concat(devs.map(function (d) { return { t: d, v: d }; })));
}

// ---- boot ------------------------------------------------------------------
var sub = document.getElementById("sub");
sub.textContent = SNAPSHOT ? "Loading snapshot\u2026" : "Loading events\u2026";
fetchAll(function (n) { sub.textContent = "Loaded " + n + " events\u2026"; })
  .then(function (rows) {
    ROWS = rows || [];
    // A pre-v2 row has no `source`, so defaulting the filter to `itch` would hide the entire
    // history the moment the table has any. Fall back to "all" when nothing is tagged itch.
    if (!ROWS.some(function (r) { return r.source === "itch"; })) FILTER.source = "";
    var days = uniq(ROWS.map(dayOf)).sort();
    sub.textContent = ROWS.length + " events"
      + (days.length ? "  \u00b7  " + days[0] + " \u2192 " + days[days.length - 1] : "")
      + (SNAPSHOT ? "  \u00b7  SNAPSHOT taken " + SNAPSHOT_AT + ", not live" : "");
    buildBar();
    render();
    document.getElementById("foot").innerHTML = SNAPSHOT
      ? "A point-in-time snapshot. Regenerate with <code>node scripts/gen-analytics.mjs --snapshot rows.json</code>."
      : "Live from the <code>events</code> table (public anon key, read-only). Anonymous device + session ids only \u2014 no names, no IP, no user-agent. Schema and migration: <code>docs/leaderboard-setup.md</code>.";
  })
  .catch(function (e) {
    sub.className = "err";
    sub.textContent = "Could not load events: " + e.message;
    document.getElementById("foot").innerHTML = "If this says <em>Failed to fetch</em>, the page is probably opened as a <code>file://</code> URL \u2014 Supabase refuses those. Serve it: <code>python3 -m http.server 8000</code> in the repo root, then open <code>/docs/analytics.html</code>.";
  });
</script>
