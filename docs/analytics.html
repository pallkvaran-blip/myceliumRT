  // day those two differ a lot. A player's events are grouped and split wherever there is a gap of
  // VISIT_GAP or more, so a reload, a crash-and-retry and an accidental double-open are ONE visit.

  section("Coming back");
  // ONE SECTION, NOT TWO (owner: "rethink how you show player retention stats - very confusing
  // now"). There were literally two headings called "Coming back" — a visits/gap one here and a
  // day-1/3/7 cohort one down in Devices — measuring the same thing two different ways, several
  // screens apart, with no sentence anywhere saying what the answer was. They are merged, the
  // duplicate cut ("by arrival day, came back later" said what the cohort table says better), and
  // the whole thing now OPENS ON A SENTENCE. A dashboard that makes the reader assemble the
  // finding out of five percentages has not reported anything.
  var retRows = ROWS.filter(function (r) { return r.client_id && r.created_at && inFilterNoDays(r); });
  var byPlayer = {};
  retRows.forEach(function (r) {
    var t = new Date(r.created_at).getTime();
    if (!(t > 0)) return;
    (byPlayer[r.client_id] || (byPlayer[r.client_id] = [])).push(t);
  });
  var NOW = Date.now();
  var people = Object.keys(byPlayer).map(function (id) {
    var ts = byPlayer[id].sort(function (a, b) { return a - b; });
    var visits = [ts[0]];
    for (var i = 1; i < ts.length; i++) if (ts[i] - ts[i - 1] >= VISIT_GAP) visits.push(ts[i]);
    return { first: ts[0], visits: visits };
  });
  // ONLY PLAYERS WHO HAVE HAD THE CHANCE. Somebody who first played an hour ago has not failed to
  // return — they have not been asked yet. Right after a launch they are MOST of the population, so
  // including them drags "% who came back" toward zero and makes a healthy game look dead.
  var mature = people.filter(function (p) { return NOW - p.first >= DAY; });
  var returned = mature.filter(function (p) { return p.visits.length > 1; });
  var gaps = returned.map(function (p) { return p.visits[1] - p.visits[0]; });

  var prA = panel(); prA.style.marginBottom = "10px";
  // THE ANSWER, IN A SENTENCE, BEFORE ANY TABLE.
  var lead = el("p", "lead");
  if (!people.length) lead.textContent = "No players in this window.";
  else if (!mature.length) lead.textContent = "All " + people.length + " players here arrived in the last 24 hours,"
    + " so none of them has had a chance to come back yet. Retention needs a day to mean anything.";
  else lead.innerHTML = "Of the <b>" + mature.length + "</b> players who first played more than a day ago, <b>"
    + returned.length + "</b> (" + pct(returned.length, mature.length) + "%) came back at least once"
    + (gaps.length ? ", typically after <b>" + fmtMs(median(gaps)) + "</b>" : "") + "."
    + (people.length > mature.length ? " A further " + (people.length - mature.length) + " arrived too recently to count." : "");
  prA.appendChild(lead);
  var kr = el("div", "cards"); prA.appendChild(kr);
  kpi(kr, String(people.length), "players", "all time, this source");
  kpi(kr, mature.length ? pct(returned.length, mature.length) + "%" : "–", "came back",
      mature.length ? returned.length + " of " + mature.length + " old enough to judge" : "nobody is a day old yet");
  kpi(kr, gaps.length ? fmtMs(median(gaps)) : "–", "typical gap", "first visit to second");

  // TWO TABLES, AND THEY ANSWER DIFFERENT QUESTIONS: how MANY times, and how SOON. Side by side
  // rather than stacked, because reading them together is the point.
  var pr2 = el("div", "row2"); document.getElementById("body").appendChild(pr2);
  var prB = el("div", "panel"); pr2.appendChild(prB);
  prB.appendChild(el("h2", "", "How many times they came")).style.margin = "0 0 8px";
  var vt = table(prB, ["visits", "players"]);
  var vb = [["1 — never came back", 1, 1], ["2", 2, 2], ["3", 3, 3], ["4–5", 4, 5], ["6+", 6, Infinity]];
  vb.forEach(function (b) {
    var n = mature.filter(function (p) { return p.visits.length >= b[1] && p.visits.length <= b[2]; }).length;
    barRow(vt, b[0], n, mature.length || 1, b[1] === 1 ? "bad" : "", 1);
  });
  prB.appendChild(el("p", "empty", "A VISIT, not a session — a reload mints a new session id, so"
    + " anything inside " + Math.round(VISIT_GAP / 60000) + " minutes counts as one visit."));
  var prC = el("div", "panel"); pr2.appendChild(prC);
  prC.appendChild(el("h2", "", "How soon they came back")).style.margin = "0 0 8px";
  var tt = table(prC, ["came back after", "players"]);
  var tb2 = [["under 2 hours", 0, 2 * 3600000], ["2–12 hours", 2 * 3600000, 12 * 3600000],
             ["12 hours – 2 days", 12 * 3600000, 2 * DAY], ["2–7 days", 2 * DAY, 7 * DAY],
             ["over a week", 7 * DAY, Infinity]];
  if (!gaps.length) prC.appendChild(el("p", "empty", "Nobody has come back a second time yet."));
  tb2.forEach(function (b) {
    var n = gaps.filter(function (g) { return g >= b[1] && g < b[2]; }).length;
    barRow(tt, b[0], n, gaps.length || 1, "", 1);
  });

  // THE COHORT TABLE, moved up from where it used to sit under Devices — the second half of the
  // duplicate. One overall percentage hides a trend: a store feature or a devlog brings a wave of
  // players whose retention can be quite different from the trickle before it.
  var prt = panel(); prt.style.marginTop = "10px";
  prt.appendChild(el("h2", "", "By the day they arrived")).style.margin = "0 0 8px";
  // First-seen day per device, over the WHOLE table rather than the filtered window: a cohort
  // is about a player’s history, and clipping it to 30 days would call every older player new.
  var first = {}, seen = {};
  ROWS.forEach(function (r) {
    var d = dayOf(r), c = r.client_id;
    if (!c || !d) return;
    if (!first[c] || d < first[c]) first[c] = d;
    (seen[c] || (seen[c] = {}))[d] = 1;
  });
  var dayMs = 86400000;
  var cohorts = {};
  Object.keys(first).forEach(function (c) {
    var f = first[c];
    var row = cohorts[f] || (cohorts[f] = { n: 0, d1: 0, d3: 0, d7: 0 });
    row.n++;
    var t0 = new Date(f + "T00:00:00Z").getTime();
    var days = Object.keys(seen[c]);
    for (var i = 0; i < days.length; i++) {
      var k = Math.round((new Date(days[i] + "T00:00:00Z").getTime() - t0) / dayMs);
      if (k === 1) row.d1++;
      if (k === 3) row.d3++;
      if (k === 7) row.d7++;
    }
  });
  var ckeys = Object.keys(cohorts).sort().reverse().slice(0, 14);
  if (!ckeys.length) prt.appendChild(el("p", "empty", "Not enough history yet."));
  else {
    var rtb = table(prt, ["first seen", { t: "new players", n: 1 }, { t: "day 1", n: 1 }, { t: "day 3", n: 1 }, { t: "day 7", n: 1 }]);
    ckeys.forEach(function (d) {
      var c = cohorts[d];
      trow(rtb, [d, { t: c.n, n: 1 }, { t: c.n ? pct(c.d1, c.n) + "%" : "–", n: 1 },
        { t: c.n ? pct(c.d3, c.n) + "%" : "–", n: 1 }, { t: c.n ? pct(c.d7, c.n) + "%" : "–", n: 1 }]);
    });
    prt.appendChild(el("p", "empty", "Each row is every player first seen that day, and the share of"
      + " them who played again on exactly day 1, 3 and 7. A cohort younger than N days cannot"
      + " have a day-N number yet."));
  }

  // Players per day — the shape everything above sits on. Also moved up from Devices.
  var pday = panel(); pday.style.marginTop = "10px";
  pday.appendChild(el("h2", "", "Players per day")).style.margin = "0 0 8px";
  var byDay = {};
  rows.forEach(function (r) { var d = dayOf(r); if (!d) return; (byDay[d] || (byDay[d] = {}))[r.client_id] = 1; });
  var dk = Object.keys(byDay).sort();
  if (dk.length < 2) pday.appendChild(el("p", "empty", "One day of data so far."));
  else {
    var cv = el("canvas"); cv.width = 1100; cv.height = 110; pday.appendChild(cv);
    var pctx = cv.getContext("2d");
    var vals = dk.map(function (d) { return Object.keys(byDay[d]).length; });
    var mx2 = Math.max.apply(null, vals) || 1;
    var w = cv.width / vals.length;
    pctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--acc").trim() || "#7fe6a3";
    for (var i = 0; i < vals.length; i++) {
      var h = Math.max(2, (vals[i] / mx2) * (cv.height - 16));
      pctx.globalAlpha = 0.55; pctx.fillRect(i * w + 1, cv.height - h, Math.max(1, w - 2), h);
    }
    pctx.globalAlpha = 1;
    pday.appendChild(el("p", "empty", dk[0] + " → " + dk[dk.length - 1] + "  ·  peak " + mx2 + " players in a day"));
  }
  // THE FLOOR CAVEAT, ON SCREEN RATHER THAN IN A COMMENT. Anyone reading a retention number needs
  // to know which direction it is wrong in.
  pday.appendChild(el("p", "empty", "A player is a browser localStorage id. The same person on a"
    + " phone and a laptop counts as two, and clearing site data makes a new one — and on"
    + " CrazyGames and Newgrounds the game runs in an iframe on THEIR domain, where browsers evict"
    + " third-party storage hard. So every number here is a FLOOR: real return rates are higher by"
    + " an unknown amount, and comparing sources is comparing storage policies as much as games."));

  // ---- HOW FAR PEOPLE GET (the owner's headline question) ------------------
  // ONE TABLE PER GAME, AND THE ROWS ARE SPLIT ON `r.game`, NOT ON `gameOf`. This was hard-coded
  // to `r.game === "campaign"` and titled as if it covered everything, so selecting Game=survival
  // left it filtering survival-attributed rows for a campaign tag: the CrazyGames survival table
  // read ONE level-1 attempt (the single campaign row inside a session that had opened survival)
  // against 120 real ones by 72 players. The chip is a SESSION filter and a level_start knows
  // which game it belongs to itself, so the split here is per row and the chip only decides which
  // tables are worth drawing.
  section("How far people get");
  var lvlGames = FILTER.game && FILTER.game !== GAME_NONE ? [FILTER.game] : ["campaign", "survival"];
  var drewLevels = 0;
  lvlGames.forEach(function (G) {
    var camp = rows.filter(function (r) { return r.game === G; });
    var starts2 = camp.filter(function (r) { return r.kind === "level_start"; });
    var clears = camp.filter(function (r) { return r.kind === "level_clear"; });
    if (!starts2.length) return;
    drewLevels++;
    var pc = panel();
    // WHICH GAME THIS PANEL IS, IN THE MARKUP. It used to be identifiable only by its lede, and
    // when the survival lede was dropped the panel became anonymous — `analytics-check` could no
    // longer find it and reported the survival table as missing on a page that drew it correctly.
    pc.dataset.game = G;
    // The campaign lede stays and survival gets none (owner). Survival is withheld from the build
    // now, so its table is history rather than a live game — and a line explaining what an open
    // ladder is has no reader left.
    if (G === "campaign") pc.appendChild(el("p", "empty", "Campaign — " + CAMPAIGN_LEVELS + " levels, the same fixed maps every run"));
    // PLAYERS IS ITS OWN COLUMN, not folded into the level label. "Only one person started level
    // 1" is how the bug above was reported, and attempts alone cannot answer that: a level with
    // 119 attempts can be 72 people or one very stubborn one.
    var lt = table(pc, ["level", { t: "players", n: 1 }, { t: "attempts", n: 1 }, { t: "cleared", n: 1 }, { t: "clear rate", n: 1 }, "reached (share of runs)"]);
    var lvl1 = starts2.filter(function (r) { return r.level === 1; }).length || starts2.length;
    // Campaign has a fixed length and empty tail rows are informative (nobody got there).
    // Survival does not, so it runs to the deepest level anyone actually started.
    var deepest = 0;
    starts2.forEach(function (r) { if (r.level > deepest) deepest = r.level; });
    var last = G === "campaign" ? CAMPAIGN_LEVELS : Math.min(Math.max(deepest, 1), 20);
    for (var L = 1; L <= last; L++) {
      var att = starts2.filter(function (r) { return r.level === L; }).length;
      var cl = clears.filter(function (r) { return r.level === L; }).length;
      var pl = uniq(starts2.filter(function (r) { return r.level === L; }).map(function (r) { return r.client_id; })).length;
      var tr = el("tr");
      tr.appendChild(el("td", "", "Level " + L));
      tr.appendChild(el("td", "n", String(pl)));
      tr.appendChild(el("td", "n", String(att)));
      tr.appendChild(el("td", "n", String(cl)));
      tr.appendChild(el("td", "n", att ? pct(cl, att) + "%" : "–"));
      var td = el("td"); td.style.width = "44%";
      var tk = el("div", "track");
      var f = el("div", "fill" + (att && pct(cl, att) < 35 ? " bad" : (att && pct(cl, att) < 60 ? " warn" : "")));
      f.style.width = (lvl1 ? (att / lvl1) * 100 : 0) + "%";
      tk.appendChild(f); tk.appendChild(el("span", "", pct(att, lvl1) + "% of level-1 attempts"));
      td.appendChild(tk); tr.appendChild(td);
      lt.appendChild(tr);
    }
    var ends2 = camp.filter(function (r) { return r.kind === "run_end"; }).length;
    if (G === "campaign") {
      var finished = camp.filter(function (r) { return r.kind === "run_end" && r.cause === "won" && r.level >= CAMPAIGN_LEVELS; }).length;
      pc.appendChild(el("p", "empty", "Campaign finished " + finished + " time(s)"
        + (ends2 ? " — " + pct(finished, ends2) + "% of campaign runs that ended" : "")
        + ". A level whose clear rate is under 35% is red, under 60% amber."));
    } else {
      pc.appendChild(el("p", "empty", "Deepest level anyone started: " + deepest
        + (deepest > last ? " (table stops at " + last + ")" : "")
        + ". A level whose clear rate is under 35% is red, under 60% amber."));
    }
  });
  if (!drewLevels) panel().appendChild(el("p", "empty", "No levels started in this window."));

  // ---- deaths ---------------------------------------------------------------
  var p2 = el("div", "row2"); document.getElementById("body").appendChild(p2);
  var pd = el("div", "panel"); p2.appendChild(pd);
  pd.appendChild(el("h2", "", "What ends a run")).style.margin = "0 0 8px";
  var causes = {};
  ends.forEach(function (r) { causes[r.cause || "?"] = (causes[r.cause || "?"] || 0) + 1; });
  var ck = Object.keys(causes).sort(function (a, b) { return causes[b] - causes[a]; });
  if (!ck.length) pd.appendChild(el("p", "empty", "No runs have ended in this window."));
  else { var ct = table(pd, ["cause", "runs"]); ck.forEach(function (k) { barRow(ct, k, causes[k], ends.length, k === "won" ? "" : (k === "abandon" ? "warn" : "bad"), 1); }); }
  var pr = el("div", "panel"); p2.appendChild(pr);
  pr.appendChild(el("h2", "", "Retries")).style.margin = "0 0 8px";
  var retries = of("retry");
  if (!retries.length) pr.appendChild(el("p", "empty", "No retries used in this window — nobody bought one, or nobody needed one."));
  else {
    // Per ATTEMPT, which is the question ("how often does this level need a second go?"). Scaled
    // to the biggest bar it would only say which level has the most retries in absolute terms —
    // mostly a statement about how many people reach it at all.
    var rt = table(pr, ["level", "retries per attempt"]);
    var byL = {}; retries.forEach(function (r) { byL[r.level] = (byL[r.level] || 0) + 1; });
    var attL = {}; rows.filter(function (r) { return r.kind === "level_start"; }).forEach(function (r) { attL[r.level] = (attL[r.level] || 0) + 1; });
    Object.keys(byL).sort(function (a, b) { return a - b; }).forEach(function (k) {
      barRow(rt, "Level " + k, byL[k], attL[k] || byL[k], "warn", 1);
    });
  }

  // ---- DEVICES --------------------------------------------------------------
  section("Devices");
  var pdv = panel();
  var devs = uniq(rows.map(function (r) { return r.device; })).sort();
  // AN EXPLICIT UNKNOWN BUCKET, because `uniq` drops nulls and a PRE-v2 row carries no `device`.
  // Without it the listed devices covered fewer sessions than `allSessions` and the share column
  // quietly summed to under 100 — the same defect the player-vs-session fix below was for, and it
  // arrives on its own the moment an old build and a new one are both in the table.
  if (rows.some(function (r) { return r.device == null; })) devs.push(null);
  var dt = table(pdv, ["device", { t: "players", n: 1 }, { t: "sessions", n: 1 }, { t: "runs", n: 1 },
    { t: "levels cleared", n: 1 }, { t: "median frame", n: 1 }, "share of sessions"]);
  // SHARE OF SESSIONS, not of players. A device id is a browser, and a browser whose window is
  // resized across a bucket boundary legitimately appears under two device classes — so the
  // player shares summed to over 100% on the first render of this page. A session is the honest
  // unit, and it is also the one a per-device rate should be against.
  var allSessions = sessions.length;
  devs.forEach(function (d) {
    var sub = rows.filter(function (r) { return d == null ? r.device == null : r.device === d; });
    var pl = uniq(sub.map(function (r) { return r.client_id; })).length;
    var perfs = sub.filter(function (r) { return r.kind === "perf" && r.ms != null; }).map(function (r) { return r.ms / 10; });
    var tr = el("tr");
    tr.appendChild(el("td", "", d || "unknown"));
    tr.appendChild(el("td", "n", String(pl)));
    tr.appendChild(el("td", "n", String(uniq(sub.map(function (r) { return r.session_id; })).length)));
    tr.appendChild(el("td", "n", String(sub.filter(function (r) { return r.kind === "run_start"; }).length)));
    tr.appendChild(el("td", "n", String(sub.filter(function (r) { return r.kind === "level_clear"; }).length)));
    var md = median(perfs);
    tr.appendChild(el("td", "n", md == null ? "–" : (Math.round(md * 10) / 10) + " ms"));
    var td = el("td"); td.style.width = "34%";
    var ss = uniq(sub.map(function (r) { return r.session_id; })).length;
    var tk = el("div", "track"); var f = el("div", "fill"); f.style.width = (allSessions ? (ss / allSessions) * 100 : 0) + "%";
    tk.appendChild(f); tk.appendChild(el("span", "", pct(ss, allSessions) + "%"));
    td.appendChild(tk); tr.appendChild(td);
    dt.appendChild(tr);
  });
  var slow = rows.filter(function (r) { return r.kind === "perf" && r.cause === "bad"; }).length;
  var perfN = rows.filter(function (r) { return r.kind === "perf"; }).length;
  pdv.appendChild(el("p", "empty", perfN
    ? slow + " of " + perfN + " perf samples were in the \u201cbad\u201d bucket (median frame over 20 ms)."
    : "No perf samples yet — one is taken per session after 90 frames."));

  // ---- BEFORE AND AFTER THE LAST RELEASE ------------------------------------
  // SIDE BY SIDE, NOT BEHIND A FILTER (owner asked for the comparison; the Release chips that used
  // to serve it are gone). A filter you toggle makes you hold the previous number in your head and
  // compare from memory, which is how you talk yourself into a result.
  //
  // THE CUT IS THE BUILD STAMP, NOT A DATE, and on these stores that is not a nicety: itch and
  // CrazyGames serve whatever zip was last uploaded and a browser can hold a cached copy for days,
  // so a date cut files old-build sessions under "after" and flatters the release. Every session
  // on a stamped build carries one; a session with none predates the change that added stamping,
  // which makes "no stamp" an exact label rather than a gap.
  // TWO ROWS, CUT AT THE LATEST BUILD (owner: "the proper cutoff point is now, not earlier
  // today"). It used to draw one row per stamp, which on a day with two uploads split the
  // baseline in half and gave the release five sessions to be judged against — the previous
  // build had shipped that morning and got a row of its own. The question is always "this build
  // against everything before it", so the older stamps fold into the baseline and are named in
  // the footnote rather than given rows.
  //
  // THE LATEST IS THE NEWEST STAMP IN THE DATA, not a constant here: `BUILD_ID` is the literal
  // "dev" in the repo and only becomes a stamp when make-web-zip patches a COPY at build time, so
  // this page cannot read what was actually uploaded. Reading it off the rows means the cut moves
  // to a new release on its own, the first time anybody plays one.
  section("Before and after the last release");
  var pcmp = panel();
  var cross = ROWS.filter(inFilterCrossRelease);
  var stamps = uniq(cross.map(buildOf).filter(function (b) { return b !== BUILD_NONE; })).sort().reverse();
  var latest = stamps[0] || null;
  var byBuild = {};
  var LATEST = "__latest", OLDER = "__older";
  cross.forEach(function (r) {
    var k = (latest && buildOf(r) === latest) ? LATEST : OLDER;
    (byBuild[k] || (byBuild[k] = [])).push(r);
  });
  var order = [];
  if (byBuild[LATEST]) order.push(LATEST);
  if (byBuild[OLDER]) order.push(OLDER);
  if (!latest) {
    pcmp.appendChild(el("p", "empty", "No stamped sessions yet — no build that stamps itself has"
      + " been played. This fills in as soon as one is."));
  } else if (order.length < 2) {
    pcmp.appendChild(el("p", "empty", "Only one side so far. This becomes a comparison once there"
      + " are sessions on both sides of " + latest + "."));
  }
  // WHEN the cut is, in words, because "the latest build" is not a date anyone can check.
  var firstSeen = null;
  if (latest) cross.forEach(function (r) {
    if (buildOf(r) !== latest) return;
    var t = new Date(r.created_at).getTime();
    if (t > 0 && (firstSeen == null || t < firstSeen)) firstSeen = t;
  });
  if (latest) pcmp.appendChild(el("p", "lead", "Cut at " + latest
    + (firstSeen ? ", first played " + new Date(firstSeen).toISOString().replace("T", " ").slice(0, 16) + " UTC" : "")
    + ". Everything before it is one baseline — the previous build and every older session together."));

  // PLAY TIME IS THE HEADLINE (owner). `session_end.ms` is the length of one visit and it is the
  // closest thing here to "did they enjoy it" — a release that makes the game better shows up as
  // people staying longer before it shows up anywhere else. MEDIAN, not mean: one player who left
  // a tab open overnight moves a mean by minutes and a median not at all.
  // TWO PERCENTAGE COLUMNS, TWO DENOMINATORS, AND THE HEADER SAYS WHICH. "Reached a run" is per
  // SESSION — what share of visits become a play — and "cleared a level" is per PLAYER, because
  // the question is how many PEOPLE got anywhere, and someone who cleared on their second visit
  // did clear. Two adjacent percentages over different denominators is exactly the trap the level
  // table fell into ("it says only 1 person started lvl 1"), so neither is left implicit.
  var ct2 = table(pcmp, ["release", { t: "players", n: 1 }, { t: "sessions", n: 1 },
    { t: "median play time", n: 1 }, { t: "reached a run (sessions)", n: 1 },
    { t: "cleared a level (players)", n: 1 }, { t: "levels cleared", n: 1 }]);
  order.forEach(function (b) {
    var rs = byBuild[b];
    var players = uniq(rs.map(function (r) { return r.client_id; })).length;
    var sess = uniq(rs.map(function (r) { return r.session_id; })).length;
    var mins = rs.filter(function (r) { return r.kind === "session_end" && r.ms != null; })
                 .map(function (r) { return r.ms; });
    var ran = uniq(rs.filter(function (r) { return r.kind === "run_start"; })
                     .map(function (r) { return r.session_id; })).length;
    var cleared = rs.filter(function (r) { return r.kind === "level_clear"; }).length;
    // DISTINCT PLAYERS with at least one clear, not a share of the raw count beside it — one
    // player who cleared nine levels is one person who got somewhere, and counting clears would
    // let them carry the column on their own.
    var clearedBy = uniq(rs.filter(function (r) { return r.kind === "level_clear"; })
                           .map(function (r) { return r.client_id; })).length;
    var tr = el("tr");
    tr.appendChild(el("td", "", b === LATEST ? latest : "everything before it"));
    tr.appendChild(el("td", "n", String(players)));
    tr.appendChild(el("td", "n", String(sess)));
    var td = el("td", "n", mins.length ? fmtMs(median(mins)) : "–");
    td.style.fontWeight = "700";
    tr.appendChild(td);
    tr.appendChild(el("td", "n", ran + "  ·  " + pct(ran, sess) + "%"));
    var tdc = el("td", "n", clearedBy + "  ·  " + pct(clearedBy, players) + "%");
    tdc.style.fontWeight = "700";
    tr.appendChild(tdc);
    tr.appendChild(el("td", "n", String(cleared)));
    ct2.appendChild(tr);
  });
  // A SMALL SAMPLE IS THE NORMAL STATE OF THIS TABLE for a day or two after a release, and the
  // page has to say so — otherwise the first reading of a new build is a dozen sessions presented
  // with the same confidence as a month of them.
  var newest = byBuild[LATEST] || null;
  var newestSess = newest ? uniq(newest.map(function (r) { return r.session_id; })).length : 0;
  // THE FOLDED-IN STAMPS, NAMED. The baseline is not only "before stamps" — on a day with two
  // uploads it holds the previous release too, and a row labelled "everything before it" that
  // silently contains this morning’s build would be the same trap in reverse.
  var folded = stamps.slice(1);
  if (folded.length) pcmp.appendChild(el("p", "empty", "The baseline also contains "
    + folded.map(function (b) {
        var n = uniq(cross.filter(function (r) { return buildOf(r) === b; })
                          .map(function (r) { return r.session_id; })).length;
        return b + " (" + n + " session" + (n === 1 ? "" : "s") + ")";
      }).join(", ") + ", plus every session from before builds stamped themselves."));
  pcmp.appendChild(el("p", "empty", "Play time is one VISIT, from `boot` to `session_end`."
    + " “Reached a run” is a share of SESSIONS; “cleared a level” is a share of PLAYERS — one"
    + " person who cleared nine levels is one person who got somewhere."
    + (newestSess && newestSess < 30 ? "  —  The newest release has only " + newestSess + " session(s) so far,"
        + " which is too few to read as a result: give it a day." : "")));

  // ---- ECONOMY --------------------------------------------------------------
  section("Spores, the store and the deck");
  var p3 = el("div", "row2"); document.getElementById("body").appendChild(p3);
  var pe = el("div", "panel"); p3.appendChild(pe);
  pe.appendChild(el("h2", "", "Earned vs spent")).style.margin = "0 0 8px";
  var earned = ends.reduce(function (a, r) { return a + (r.n || 0); }, 0);
  var spentU = of("upgrade").reduce(function (a, r) { return a + (r.n || 0); }, 0);
  var spentS = of("purchase").reduce(function (a, r) { return a + (r.n || 0); }, 0);
  var ke = el("div", "cards"); pe.appendChild(ke);
  kpi(ke, String(earned), "spores earned", ends.length + " runs");
  kpi(ke, String(spentU + spentS), "spores spent", of("upgrade").length + " upgrades, " + of("purchase").length + " colonies");
  kpi(ke, earned ? pct(spentU + spentS, earned) + "%" : "–", "of earnings spent",
      (spentU + spentS) > earned ? "spending exceeds the window\u2019s earnings — older balances" : "");
  var pu = el("div", "panel"); p3.appendChild(pu);
  pu.appendChild(el("h2", "", "Which upgrades")).style.margin = "0 0 8px";
  var ups = {};
  of("upgrade").forEach(function (r) { ups[r.detail || "?"] = (ups[r.detail || "?"] || 0) + 1; });
  var uk = Object.keys(ups).sort(function (a, b) { return ups[b] - ups[a]; });
  if (!uk.length) pu.appendChild(el("p", "empty", "Nobody has bought an upgrade in this window."));
  else { var ut = table(pu, ["track", "bought"]); uk.forEach(function (k) { barRow(ut, k, ups[k], ups[uk[0]]); }); }
  var pdk = panel(); pdk.style.marginTop = "10px";
  pdk.appendChild(el("h2", "", "Cards carried out of a run")).style.margin = "0 0 8px";
  var deck = of("deck").map(function (r) { return r.n || 0; });
  if (!deck.length) pdk.appendChild(el("p", "empty", "No deck picks recorded yet."));
  else pdk.appendChild(el("p", "empty", "median " + median(deck) + "  ·  max " + Math.max.apply(null, deck) + "  ·  " + deck.filter(function (v) { return v === 0; }).length + " kept nothing, of " + deck.length));

  // ---- SPECIES + DRAFTS ---------------------------------------------------
  section("Colonies and cards");
  var p4 = el("div", "row2"); document.getElementById("body").appendChild(p4);
  var psp = el("div", "panel"); p4.appendChild(psp);
  psp.appendChild(el("h2", "", "Colonies played")).style.margin = "0 0 8px";
  var sp = {}, spWin = {};
  starts.forEach(function (r) { if (r.species) sp[r.species] = (sp[r.species] || 0) + 1; });
  ends.forEach(function (r) { if (r.species && r.cause === "won") spWin[r.species] = (spWin[r.species] || 0) + 1; });
  var spk = Object.keys(sp).sort(function (a, b) { return sp[b] - sp[a]; });
  if (!spk.length) psp.appendChild(el("p", "empty", "No runs in this window."));
  else {
    var spt = table(psp, ["colony", { t: "runs", n: 1 }, { t: "wins", n: 1 }, "share"]);
    spk.forEach(function (k) {
      var tr = el("tr");
      tr.appendChild(el("td", "", speciesName(k)));
      tr.appendChild(el("td", "n", String(sp[k])));
      tr.appendChild(el("td", "n", String(spWin[k] || 0)));
      var td = el("td"); td.style.width = "46%";
      var tk = el("div", "track"); var f = el("div", "fill"); f.style.width = (sp[k] / sp[spk[0]]) * 100 + "%";
      tk.appendChild(f); tk.appendChild(el("span", "", pct(sp[k], starts.length) + "% of runs"));
      td.appendChild(tk); tr.appendChild(td); spt.appendChild(tr);
    });
  }
  var pcd = el("div", "panel"); p4.appendChild(pcd);
  pcd.appendChild(el("h2", "", "Most-drafted cards")).style.margin = "0 0 8px";
  var cards = {};
  of("draft").forEach(function (r) { cards[r.detail || "?"] = (cards[r.detail || "?"] || 0) + 1; });
  var cdk = Object.keys(cards).sort(function (a, b) { return cards[b] - cards[a]; }).slice(0, 12);
  if (!cdk.length) pcd.appendChild(el("p", "empty", "No drafts recorded in this window."));
  else { var cdt = table(pcd, ["card", "taken"]); cdk.forEach(function (k) { barRow(cdt, k, cards[k], cards[cdk[0]]); }); }

  // ---- THE ENGINES: TAKEN vs ACTUALLY BUILT ---------------------------------
  // TWO DIFFERENT QUESTIONS, AND THE GAP BETWEEN THEM IS THE FINDING (owner: "add something on
  // which engine cards people go for (choose and also install)"). `draft` says what was offered
  // and taken; `install` says what reached the board. An engine can sit in hand all run because
  // its buy-in never came together — a card with a high take rate and a low install rate is one
  // people WANT and cannot AFFORD, which is a different problem from one nobody picks.
  //
  // The type comes from CARD_DATA’s `type`, baked in at generation time — the badge on the
  // card’s face — and NOT from `displayCategory`, which is the draft POOL a card is offered from
  // and disagrees per card (Cord Capillary is an engine offered from the event pool).
  section("The engines: taken vs built");
  var peng = panel();
  var isEngine = function (n) { return CARD_TYPES[n] === "engine"; };
  var isAction = function (n) { return CARD_TYPES[n] === "action"; };
  var inst = of("install");
  var took = {}, built = {};
  of("draft").forEach(function (r) { var n = r.detail; if (n && isEngine(n)) took[n] = (took[n] || 0) + 1; });
  inst.forEach(function (r) { var n = r.detail; if (n && isEngine(n)) built[n] = (built[n] || 0) + 1; });
  var engNames = uniq(Object.keys(took).concat(Object.keys(built)));
  if (!inst.length && !engNames.length) {
    peng.appendChild(el("p", "empty", "No engine drafts or installs in this window."));
  } else {
    if (!inst.length) peng.appendChild(el("p", "empty", "No `install` events yet — that event ships"
      + " with the next build, so the BUILT column fills in once players are on it. TAKEN is live."));
    engNames.sort(function (a, b) { return (took[b] || 0) - (took[a] || 0); });
    var top = Math.max.apply(null, engNames.map(function (n) { return took[n] || 0; }).concat([1]));
    var et = table(peng, ["engine", { t: "taken", n: 1 }, { t: "built", n: 1 }, { t: "built / taken", n: 1 }, "how often it is taken"]);
    engNames.forEach(function (n) {
      var t = took[n] || 0, b = built[n] || 0;
      var tr = el("tr");
      tr.appendChild(el("td", "", n));
      tr.appendChild(el("td", "n", String(t)));
      tr.appendChild(el("td", "n", String(b)));
      // Over 100% is legitimate and not a bug: a colony can OPEN with an engine it never drafted,
      // and a deck carried between runs brings more in. Printed rather than clamped.
      tr.appendChild(el("td", "n", t ? pct(b, t) + "%" : (b ? "—" : "–")));
      var td = el("td"); td.style.width = "34%";
      var tk = el("div", "track");
      var f = el("div", "fill" + (t && pct(b, t) < 35 ? " bad" : ""));
      f.style.width = (t / top) * 100 + "%";
      tk.appendChild(f); tk.appendChild(el("span", "", String(t)));
      td.appendChild(tk); tr.appendChild(td); et.appendChild(tr);
    });
    peng.appendChild(el("p", "empty", "TAKEN is a draft pick; BUILT is the card reaching the board."
      + " A row where built is far under taken is a card people want and cannot afford — the bar is"
      + " red under 35%. Over 100% means it also arrives without being drafted: a colony’s opening"
      + " hand, or a deck carried in from the last run."));
  }
  // The installed ACTIONS beside them, from the same event — `n` is 0 for an engine and 1 for an
  // action, which is one event kind and one existing column rather than a schema change.
  var pact = panel(); pact.style.marginTop = "10px";
  pact.appendChild(el("h2", "", "Installed abilities")).style.margin = "0 0 8px";
  var acts = {};
  inst.forEach(function (r) { var n = r.detail; if (n && isAction(n)) acts[n] = (acts[n] || 0) + 1; });
  var ak = Object.keys(acts).sort(function (a, b) { return acts[b] - acts[a]; }).slice(0, 12);
  if (!ak.length) pact.appendChild(el("p", "empty", inst.length
    ? "No action cards installed in this window."
    : "Nothing yet — `install` ships with the next build."));
  else { var at = table(pact, ["ability", "installed"]); ak.forEach(function (k) { barRow(at, k, acts[k], acts[ak[0]]); }); }
}

// ---- filters ---------------------------------------------------------------
function buildBar() {
  var bar = document.getElementById("bar");
  bar.innerHTML = "";
  function group(label, key, opts) {
    var g = el("div", "grp");
    g.appendChild(el("b", "", label));
    opts.forEach(function (o) {
      var b = el("button", "chip" + (FILTER[key] === o.v ? " on" : ""), o.t);
      b.dataset.f = key; b.dataset.v = String(o.v);
      b.addEventListener("click", function () { FILTER[key] = o.v; buildBar(); render(); });
      g.appendChild(b);
    });
    bar.appendChild(g);
  }
  group("Window", "days", [{ t: "1d", v: 1 }, { t: "7d", v: 7 }, { t: "30d", v: 30 }, { t: "90d", v: 90 }, { t: "all", v: 0 }]);
  // ERA AND RELEASE ARE GONE FROM THE BAR (owner: "this is all useless now"). `Era` split on a
  // COLUMN SET — the schema change that added game/mode/device — which was a one-off long ago and
  // cannot tell one release from the next. `Release` offered every build stamp as a chip, which is
  // a filter you toggle while holding the previous number in your head; the "Before and after the
  // last release" section answers that side by side instead, and `buildOf` still backs it.
  //
  // SOURCE DEFAULTS TO `crazygames` (owner) — that is where the players are. The same table also
  // carries dev boots and Playwright runs, and mixing those into a launch number is how you
  // convince yourself the game has ten times the players it has.
  var srcs = uniq(ROWS.map(function (r) { return r.source; })).sort();
  var srcOpts = [{ t: "all", v: "" }].concat(srcs.map(function (s) { return { t: s, v: s }; }));
  if (ROWS.some(function (r) { return r.source == null; })) srcOpts.push({ t: "untagged", v: SRC_NONE });
  group("Source", "source", srcOpts);
  var gameOpts = [{ t: "both", v: "" }, { t: "campaign", v: "campaign" }, { t: "survival", v: "survival" }];
  // The bucket that used to hide inside "survival". Only offered when there are any, so a clean
  // dataset does not carry a chip that selects nothing.
  if (ROWS.some(function (r) { return gameOf(r) === GAME_NONE; })) gameOpts.push({ t: "started nothing", v: GAME_NONE });
  group("Game", "game", gameOpts);
  group("Mode", "mode", [{ t: "both", v: "" }, { t: "turn", v: "turn" }, { t: "real time", v: "realtime" }]);
  var devs = uniq(ROWS.map(function (r) { return r.device; })).sort();
  group("Device", "device", [{ t: "all", v: "" }].concat(devs.map(function (d) { return { t: d, v: d }; })));
}

// ---- boot ------------------------------------------------------------------
var sub = document.getElementById("sub");
sub.textContent = SNAPSHOT ? "Loading snapshot\u2026" : "Loading events\u2026";
fetchAll(function (n) { sub.textContent = "Loaded " + n + " events\u2026"; })
  .then(function (rows) {
    ROWS = (rows || []).map(normSource);
    indexBuilds(ROWS);
    indexGames(ROWS);
    // Fall back to "all" when the default source has no rows — otherwise a fresh table, or one
    // read before the CrazyGames build has been played, opens on an empty page that looks broken.
    if (!ROWS.some(function (r) { return r.source === FILTER.source; })) FILTER.source = "";
    var days = uniq(ROWS.map(dayOf)).sort();
    sub.textContent = ROWS.length + " events"
      + (days.length ? "  \u00b7  " + days[0] + " \u2192 " + days[days.length - 1] : "")
      + (SNAPSHOT ? "  \u00b7  SNAPSHOT taken " + SNAPSHOT_AT + ", not live" : "");
    buildBar();
    render();
    document.getElementById("foot").innerHTML = SNAPSHOT
      ? "A point-in-time snapshot. Regenerate with <code>node scripts/gen-analytics.mjs --snapshot rows.json</code>."
      : "Live from the <code>events</code> table (public anon key, read-only). Anonymous device + session ids only \u2014 no names, no IP, no user-agent. Schema and migration: <code>docs/leaderboard-setup.md</code>.";
  })
  .catch(function (e) {
    sub.className = "err";
    sub.textContent = "Could not load events: " + e.message;
    document.getElementById("foot").innerHTML = "If this says <em>Failed to fetch</em>, the page is probably opened as a <code>file://</code> URL \u2014 Supabase refuses those. Serve it: <code>python3 -m http.server 8000</code> in the repo root, then open <code>/docs/analytics.html</code>.";
  });
</script>
